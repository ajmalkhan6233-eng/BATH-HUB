<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RBH Pocket">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>RBH Pocket</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<section id="gate" class="gate" hidden>
  <h1><span>RBH</span> Pocket</h1>
  <p id="gateText">Enter your passcode</p>
  <input id="pass" type="password" inputmode="text" autocomplete="current-password" aria-label="Passcode" placeholder="Passcode">
  <button id="face" class="gold" hidden><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><path d="M9 9h.01"/><path d="M15 9h.01"/></svg>Open with Face ID</button>
  <button id="unlock" class="gold">Open</button>
  <div id="gateMsg" class="msg" role="status"></div>
</section>

<main id="app" hidden>
  <header>
    <div><h1><span>RBH</span> Pocket</h1><div id="when" class="sub" role="status"></div></div>
    <div class="btns"><button id="refresh" aria-label="Refresh"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg></button><button id="lock" aria-label="Lock"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg><span>Lock</span></button></div>
  </header>
  <div id="cards"></div>
</main>
<nav id="tabs" class="tabs" aria-label="Sections" hidden></nav>
<div id="sheet" class="sheet" hidden><div id="sheetScrim" class="scrim"></div><div class="panel" role="dialog" aria-modal="true" aria-labelledby="sheetT"><h2 id="sheetT"></h2><div id="sheetB"></div><button id="sheetX" class="gold">Close</button></div></div>
<script src="app.js"></script>
<script src="nav.js"></script>
</body>
</html>
