name: tests
on: [push, pull_request]
jobs:
  jest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node -e "const p=require('./package.json');delete p.dependencies['whatsapp-web.js'];require('fs').writeFileSync('package.json',JSON.stringify(p,null,2))"
      - run: PUPPETEER_SKIP_DOWNLOAD=1 npm install --omit=dev --ignore-scripts --no-audit --no-fund && npm install --no-save --ignore-scripts --no-audit --no-fund jest
      - run: npx jest tests/safety.test.js tests/csrfGuard.test.js
