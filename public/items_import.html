<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Import Items — Royal Bath Hub</title>
<style>
  body{margin:0;font-family:system-ui,sans-serif;background:#f6f3ec;color:#1d1d1d}
  header{background:#0a4531;color:#fff;padding:14px 16px}
  header h1{margin:0;font-size:20px}
  main{padding:12px 16px;max-width:720px;margin:0 auto}
  textarea{width:100%;box-sizing:border-box;min-height:180px;font:13px monospace;padding:8px;border:1px solid #c9bfae;border-radius:8px}
  button{font:inherit;padding:10px 14px;border-radius:8px;border:1px solid #0a4531;background:#0a4531;color:#fff;margin:6px 6px 0 0}
  button.s{background:#fff;color:#0a4531}
  pre{white-space:pre-wrap;background:#fff;border:1px solid #d9d2c3;border-radius:8px;padding:8px;font-size:13px}
  .m{font-size:12px;opacity:.8}
</style>
</head>
<body>
<header><h1>Import Items (CSV)</h1></header>
<main>
  <div class="m">Columns: name,category,selling_price,avg_cost,stock_level,reorder_threshold. "Check" saves nothing. Duplicates are skipped.</div>
  <textarea id="csv" placeholder="name,category,selling_price,avg_cost,stock_level,reorder_threshold"></textarea>
  <button id="chk" class="s">Check</button><button id="save">Save</button>
  <pre id="out">Nothing checked yet.</pre>
</main>
<script>
(function () {
  var out = document.getElementById('out'), csv = document.getElementById('csv');
  async function run(commit) {
    if (commit && !confirm('Save these items for real?')) return;
    out.textContent = 'Working...';
    try {
      var r = await fetch('/api/items/import-csv', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ csv: csv.value, commit: commit }) });
      var j = await r.json(); if (!r.ok) throw new Error(j.error || r.status);
      out.textContent = (commit ? 'SAVED ' + j.saved + '\n' : 'CHECK ONLY, nothing saved. ' + j.preview.length + ' items look fine.\n') +
        (j.skipped.length ? '\nSkipped (already exist):\n' + j.skipped.join('\n') : '') + (j.errors.length ? '\nErrors:\n' + j.errors.join('\n') : '');
    } catch (e) { out.textContent = 'Failed: ' + e.message; }
  }
  document.getElementById('chk').onclick = function () { run(false); };
  document.getElementById('save').onclick = function () { run(true); };
})();
</script>
</body>
</html>
