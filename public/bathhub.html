html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:'Outfit','Noto Sans Sinhala','Noto Sans Tamil',system-ui,sans-serif;font-size:16px;line-height:1.6}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}

.logo{font-weight:700;font-size:22px;letter-spacing:-.01em}
.logo small{display:block;font-weight:400;font-size:12px;color:var(--muted);letter-spacing:0}
.cform{display:grid;gap:10px;max-width:520px}
.cform input,.cform textarea{width:100%;font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line,#8886);background:transparent;color:inherit}
.cform .trap{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.cform button{font:inherit;padding:11px 16px;border-radius:10px;border:0;cursor:pointer;background:#25D366;color:#073b1b;font-weight:700}
.cform button[disabled]{opacity:.6;cursor:wait}
.cmsg{min-height:1.4em;font-size:14px}
.clinks{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.clinks a{color:inherit;border:1px solid currentColor;border-radius:20px;padding:6px 14px;text-decoration:none;font-size:14px;opacity:.85}
.wafab{position:fixed;right:16px;bottom:16px;z-index:50;width:54px;height:54px;border-radius:50%;background:#25D366;color:#fff;display:flex;align-items:center;justify-content:center;font-size:26px;text-decoration:none;box-shadow:0 4px 14px #0004}
.langs{display:flex;gap:6px;align-items:center}
.owner-link{font-size:12px;color:var(--muted);text-decoration:none;border:1px solid currentColor;border-radius:14px;padding:4px 10px;opacity:.7}
.owner-link:hover{opacity:1}
.langs button{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 12px;border-radius:999px;font:inherit;font-size:14px;cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.note{background:var(--note);color:var(--note-ink);font-size:13px;padding:8px 16px;text-align:center}
h1{font-size:clamp(26px,5vw,40px);line-height:1.15;margin:24px 0 6px;letter-spacing:-.02em}
h2{font-size:24px;margin:0 0 6px;letter-spacing:-.01em}
.lead{color:var(--muted);margin:0 0 16px;max-width:60ch}
section{padding:28px 0}
/* room */
.scenes{display:flex;gap:8px;margin:8px 0}
.scenes button{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:8px;font:inherit;cursor:pointer}
.scenes button[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.room{position:relative;aspect-ratio:8/5;border-radius:12px;overflow:hidden;background:var(--wall);border:1px solid var(--line)}
.wall{position:absolute;inset:0 0 48% 0;background:linear-gradient(var(--wall),var(--wall2))}
.floorbox{position:absolute;left:0;right:0;top:52%;bottom:0;overflow:hidden}
.plane{position:absolute;left:-30%;width:160%;top:0;height:260%;transform-origin:50% 0;transform:perspective(380px) rotateX(55deg)}
.floorshade{position:absolute;inset:0;background:linear-gradient(#0000002b,#00000000 45%);pointer-events:none}
.furn{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.strip{display:flex;gap:10px;overflow-x:auto;padding:12px 2px;margin:0 -2px}
.sw{flex:0 0 auto;width:84px;border:2px solid transparent;border-radius:10px;background:var(--surface);padding:4px;cursor:pointer;text-align:left;font:inherit;color:var(--ink)}
.sw[aria-pressed="true"]{border-color:var(--accent)}
.sw i{display:block;width:100%;aspect-ratio:1;border-radius:6px;background-size:cover;border:1px solid var(--line)}
.sw span{display:block;font-size:12px;line-height:1.2;margin-top:4px;color:var(--muted)}
.spec{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.spec h3{margin:0 0 8px;font-size:20px}
.spec dl{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;margin:0}
.spec dt{color:var(--muted)} .spec dd{margin:0}
.cta{display:inline-block;margin-top:12px;background:var(--accent);color:var(--accent-ink);padding:10px 18px;border-radius:8px;text-decoration:none;font-weight:500}
/* calc */
.calc{display:flex;flex-wrap:wrap;gap:12px;align-items:end;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.calc label{display:flex;flex-direction:column;font-size:14px;color:var(--muted);gap:4px}
.calc input{width:110px;padding:10px;border:1px solid var(--line);border-radius:8px;font:inherit;background:var(--bg);color:var(--ink)}
.calc output{font-weight:500;flex:1 1 220px}
/* accessories */
.acc{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.acc div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.acc b{display:block;font-weight:500}
.acc small{color:var(--muted)}
.how{display:grid;gap:12px}
.how div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.how h3{margin:0 0 4px;font-size:18px}.how p{margin:0;color:var(--muted);max-width:70ch}
footer{padding:24px 0 40px;color:var(--muted);font-size:14px;border-top:1px solid var(--line)}

.bathroom{position:relative;aspect-ratio:8/5;border-radius:12px;overflow:hidden;background:linear-gradient(var(--wall),var(--wall2));border:1px solid var(--line)}
.bfloor{position:absolute;left:0;right:0;bottom:0;height:28%;box-shadow:inset 0 10px 14px -8px #0000003a}
#bsvg{position:absolute;inset:0;width:100%;height:100%}
.bctl{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.bgrp{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.bgrp>span{min-width:92px;color:var(--muted);font-size:14px}
.bgrp button{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 12px;border-radius:8px;font:inherit;font-size:14px;cursor:pointer}
.bgrp button[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
@media (prefers-reduced-motion:no-preference){.sw,.cta,.langs button{transition:border-color .15s,background .15s}}
/* phone-friendly tap targets (audit 2026-10-04): every button at least 44px tall */
.langs button,.scenes button,.bgrp button,.cform button{min-height:44px}

function rng(seed){let s=0;for(const c of seed)s=(s*31+c.charCodeAt(0))>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
function texture(t,px){ // px = pixels per cm
  if(t.photo)return `url("${String(t.photo).replace(/["\\]/g,"")}")`;   // real product photo from the catalogue
  const W=Math.max(8,Math.round(t.w*px)),H=Math.max(8,Math.round(t.h*px)),r=rng(t.id);let d="";
  if(t.type==="veins"){for(let i=0;i<5;i++){const x=r()*W,y=r()*H;d+=`<path d="M${x} 0 Q${r()*W} ${H/2} ${x+r()*40-20} ${H}" stroke="${t.vein}" stroke-width="${r()*1.6+.4}" fill="none" opacity=".55"/>`}}
  else if(t.type==="speckle"){for(let i=0;i<90;i++){d+=`<circle cx="${r()*W}" cy="${r()*H}" r="${r()*2.2+.4}" fill="${t.vein}" opacity="${r()*.5+.25}"/>`}}
  else if(t.type==="wood"){for(let i=0;i<14;i++){const y=r()*H;d+=`<path d="M0 ${y} Q${W/2} ${y+r()*6-3} ${W} ${y+r()*4-2}" stroke="${t.vein}" stroke-width=".8" fill="none" opacity=".5"/>`}}
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><rect width="${W}" height="${H}" fill="${t.base}"/>${d}<rect x=".5" y=".5" width="${W-1}" height="${H-1}" fill="none" stroke="#00000033" stroke-width="1.5"/></svg>`;
  return `url("data:image/svg+xml;utf8,${encodeURIComponent(svg)}")`;
}
const inch=cm=>Math.round(cm/2.54);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function tapAt(type,x,rim){
  if(type==="wall")return `<rect x="${x-5}" y="${rim-76}" width="10" height="12" fill="${M}"/><path d="M${x} ${rim-66} v22 q0 10 10 10" stroke="${M}" stroke-width="7" fill="none" stroke-linecap="round"/><circle cx="${x-26}" cy="${rim-70}" r="8" fill="${M}"/><circle cx="${x+26}" cy="${rim-70}" r="8" fill="${M}"/>`;

  return `<path d="M${x} 358 V${rim-70} Q${x} ${rim-86} ${x-20} ${rim-82}" stroke="${M}" stroke-width="8" fill="none" stroke-linecap="round"/><ellipse cx="${x}" cy="358" rx="14" ry="4" fill="${M}"/>`;
}
function showerAt(sx,type){
  const rain=()=>{let r=`<rect x="${sx-76}" y="70" width="10" height="190" fill="${M}" opacity=".5"/><path d="M${sx-70} 82 H${sx}" stroke="${M}" stroke-width="7"/><ellipse cx="${sx}" cy="92" rx="36" ry="8" fill="${M}"/>`;
    for(let i=-3;i<=3;i++)r+=`<line x1="${sx+i*10}" y1="104" x2="${sx+i*10}" y2="${i%2?220:200}" stroke="${WT}" stroke-width="2" stroke-dasharray="6 7"/>`;
    return r+`<circle cx="${sx-71}" cy="230" r="9" fill="${M}"/>`};
  const hand=x=>`<rect x="${x-3}" y="100" width="6" height="150" fill="${M}"/><rect x="${x-8}" y="140" width="16" height="10" fill="${M}"/><rect x="${x+8}" y="118" width="11" height="34" rx="5" fill="${M}" transform="rotate(12 ${x+13} 135)"/><path d="M${x} 250 q-28 -10 -8 -60" stroke="${M}" stroke-width="3" fill="none"/>`;
  if(type==="rain")return rain();
  if(type==="hand")return hand(sx)+`<circle cx="${sx}" cy="262" r="9" fill="${M}"/>`;

}

  return o;

  sel = tiles[0]; SAMPLE_MODE = false;
  renderStrip(); renderText(); drawFloor(); drawBath();
});
