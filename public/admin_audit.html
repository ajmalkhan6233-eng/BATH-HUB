<!DOCTYPE html>
<html lang="en"><head>
<script src="/bathhub-theme.js"></script><script src="/bathhub-icons.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Audit log</title>
<style>
:root{--gold:#F5A623;--bg:#0D0D0D;--bg2:#141414;--card:rgba(255,255,255,.04);--card-border:rgba(255,255,255,.1);--text:#f0f0f0;--text2:#999;--red:#ef4444}
@media (prefers-color-scheme:light){:root{--bg:#f4f5f7;--bg2:#fff;--card:#fff;--card-border:rgba(0,0,0,.12);--text:#1a1a1a;--text2:#555}}
*{box-sizing:border-box}body{margin:0;padding:14px;background:var(--bg);color:var(--text);font:14px/1.4 system-ui,Segoe UI,sans-serif}
h1{font-size:20px;margin:0 0 4px;color:var(--gold)}.sub{color:var(--text2);margin-bottom:12px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin-bottom:12px}.bar div{flex:1 1 130px}
label{display:block;color:var(--text2);font-size:12px;margin-bottom:2px}input{width:100%;padding:8px;border-radius:8px;border:1px solid var(--card-border);background:var(--bg2);color:var(--text);font:inherit}
button{background:var(--card);color:var(--text);border:1px solid var(--card-border);border-radius:8px;padding:8px 12px;cursor:pointer;font:inherit}button.gold{background:var(--gold);color:var(--text-primary);border-color:var(--gold);font-weight:600}
.wrap{overflow-x:auto;border:1px solid var(--card-border);border-radius:12px}table{width:100%;border-collapse:collapse;min-width:640px}
th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--card-border);font-size:14px;vertical-align:top}th{color:var(--text2)}
.d{color:var(--text2);word-break:break-all;font-size:12px}#msg{color:var(--red);min-height:20px}.pg{display:flex;gap:8px;margin-top:10px;align-items:center}
</style><link rel="stylesheet" href="/bathhub-design.css">
</head><body>
<h1>Audit log</h1><div class="sub">Admin only. Who changed what, newest first.</div>
<div class="bar">
<div><label>Actor</label><input id="actor" placeholder="username"></div>
<div><label>Action starts with</label><input id="action" placeholder="user."></div>
<div><label>From</label><input id="from" type="date"></div>
<div><label>To</label><input id="to" type="date"></div>
<button class="gold" id="go">Search</button><button id="csv">Export CSV</button></div>
<div id="msg"></div>
<div class="wrap"><table><thead><tr><th>When</th><th>Who</th><th>Action</th><th>Record</th><th>Details</th></tr></thead><tbody id="rows"></tbody></table></div>
<div class="pg"><button id="prev">Previous</button><button id="next">Next</button><span id="pn" class="d"></span></div>
<script>
const E=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id);const LIM=50;let off=0;
function qs(extra){const p=new URLSearchParams();['actor','action','from','to'].forEach(k=>{if($(k).value.trim())p.set(k,$(k).value.trim())});for(const k in extra)p.set(k,extra[k]);return p.toString();}
async function load(){
  $('msg').textContent='';
  try{const r=await fetch('/api/admin-core/audit?'+qs({limit:LIM,offset:off}),{credentials:'same-origin'});const j=await r.json();
    if(!r.ok)throw new Error(j.error||('Error '+r.status));
    $('rows').innerHTML=j.rows.map(x=>'<tr><td>'+E(new Date(x.at).toLocaleString())+'</td><td>'+E(x.actor)+'<div class="d">'+E(x.actor_role||'')+'</div></td><td>'+E(x.action)+'</td><td>'+E(x.target_type||'')+' '+E(x.target_id||'')+'</td><td class="d">'+E(x.detail==null?'':JSON.stringify(x.detail))+'</td></tr>').join('')||'<tr><td colspan="5" class="d">Nothing found.</td></tr>';
    $('prev').disabled=off===0;$('next').disabled=j.rows.length<LIM;$('pn').textContent='Rows '+(j.rows.length?off+1:0)+' to '+(off+j.rows.length);
  }catch(e){$('msg').textContent=e.message}}
$('go').onclick=()=>{off=0;load()};$('prev').onclick=()=>{off=Math.max(0,off-LIM);load()};$('next').onclick=()=>{off+=LIM;load()};
$('csv').onclick=()=>{location.href='/api/admin-core/audit/export.csv?'+qs({})};
load();
</script></body></html>
