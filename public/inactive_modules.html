<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inactive modules</title>
<style>
:root{--bg:#0D0D0D;--card:rgba(255,255,255,.05);--bd:rgba(255,255,255,.12);--tx:#f0f0f0;--tx2:#9a9a9a;--gold:#F5A623;--green:#22c55e;--red:#ef4444}
@media (prefers-color-scheme:light){:root{--bg:#f4f5f7;--card:#fff;--bd:rgba(0,0,0,.12);--tx:#1a1a1a;--tx2:#555}}
body{margin:0;padding:14px;background:var(--bg);color:var(--tx);font:15px -apple-system,Segoe UI,Roboto,sans-serif}
h1{font-size:20px;color:var(--gold);margin:0 0 4px}.sub{color:var(--tx2);margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pill{border-radius:20px;padding:2px 10px;font-size:12px;border:1px solid var(--bd)}.on{color:var(--green)}.off{color:var(--red)}
button{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:8px 12px;font:inherit;cursor:pointer;min-height:40px}
a{color:var(--gold)}.pages{margin-top:6px;color:var(--tx2);font-size:13px;line-height:1.7}.msg{color:var(--tx2);margin:8px 0}
</style></head><body>
<h1>Inactive modules</h1><div class="sub">Switch a module off to hide it from the menu. Nothing is deleted. Open any page from here.</div>
<div id="msg" class="msg">Loading...</div><div id="list"></div>
<script>
var admin=false;
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function draw(c){
  document.getElementById('msg').textContent=admin?'':'Only the admin can switch modules on or off.';
  document.getElementById('list').innerHTML=c.modules.map(function(m){
    var links=m.pages.map(function(k){return '<a href="/owner#/'+esc(k)+'" target="_top">'+esc(k)+'</a>'}).join(' &middot; ');
    return '<div class="card"><div class="row"><div><b>'+esc(m.label)+'</b> <span class="pill '+(m.active?'on':'off')+'">'+(m.active?'ON':'OFF')+'</span></div>'
      +(admin?'<button data-k="'+esc(m.key)+'" data-a="'+(!m.active)+'">'+(m.active?'Switch off':'Switch on')+'</button>':'')+'</div><div class="pages">'+links+'</div></div>';
  }).join('');
}
function load(){fetch('/api/modules',{credentials:'include'}).then(function(r){return r.json()}).then(draw).catch(function(){document.getElementById('msg').textContent='Could not load.'})}
document.addEventListener('click',function(e){var b=e.target.closest('button[data-k]');if(!b)return;
  fetch('/api/modules/'+b.dataset.k,{method:'PUT',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({active:b.dataset.a==='true'})})
   .then(function(r){return r.json()}).then(function(c){if(c.error){document.getElementById('msg').textContent=c.error}else{draw(c);document.getElementById('msg').textContent='Saved. Reload the app to see the menu change.'}})});
fetch('/api/me',{credentials:'include'}).then(function(r){return r.ok?r.json():null}).then(function(me){admin=!!(me&&me.role==='admin');load()}).catch(load);
</script></body></html>
