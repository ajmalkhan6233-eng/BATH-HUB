<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Royal Bath Hub Receipt</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { width: 1122px; background:#0b0b0c; color:#111; font-family: Arial, Helvetica, sans-serif; font-size: 27px; line-height: 1.3; }
.sheet { width:1122px; position:relative; overflow:hidden; background:#fffdf7; padding:0 56px 0; }
.mid { position:relative; margin:0 -56px; padding:6px 56px 22px; background:linear-gradient(rgba(255,253,247,.4),rgba(255,253,247,.4)),var(--bg-mid,url('../receipt-mid.jpg')) center/cover no-repeat; }
.top { margin:0 -56px; height:236px; background-color:var(--hdr,#0b0b0c); background-image:linear-gradient(90deg,rgba(var(--hdr-rgb,11,11,12),.92) 0%,rgba(var(--hdr-rgb,11,11,12),.8) 40%,rgba(var(--hdr-rgb,11,11,12),.3) 72%,rgba(var(--hdr-rgb,11,11,12),.08) 100%),var(--bg-top,url('../receipt-top.jpg')); background-size:cover,cover; background-position:center; background-repeat:no-repeat; border-bottom:5px solid #c9a24b; padding:26px 56px 0; text-align:left; }
.logo-img { -webkit-mask-image:linear-gradient(90deg,transparent,#000 5%,#000 95%,transparent),linear-gradient(180deg,transparent,#000 8%,#000 92%,transparent); -webkit-mask-composite:source-in; mask-composite:intersect; height:122px; width:auto; display:block; }
.addr { color:#e8cf8a; font-size:22px; letter-spacing:.03em; margin-top:14px; line-height:1.45; }
.addr b { color:#25D366; font-weight:800; }
.rbar { display:flex; justify-content:space-between; align-items:center; margin:14px 0 8px; padding-bottom:8px; border-bottom:2px solid #c9a24b; }
.rbar .rc { font-weight:800; letter-spacing:.22em; color:#8a6a1c; font-size:24px; }
.rbar .rb { font-weight:800; font-size:26px; }
.meta-grid { display:grid; grid-template-columns:.8fr 1.4fr 1fr; gap:6px 14px; margin-bottom:10px; }
.meta-item { display:flex; flex-direction:column; min-width:0; }
.meta-label { color:#8a6a1c; font-size:16px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; }
.meta-val { font-weight:700; font-size:24px; word-break:break-word; }
table { width:100%; border-collapse:collapse; margin-bottom:10px; font-size:26px; }
th { color:#8a6a1c; font-size:17px; text-transform:uppercase; border-bottom:2px solid #c9a24b; padding-bottom:6px; text-align:left; letter-spacing:.1em; }
th.num, td.num { text-align:right; }
td { padding:8px 0; border-bottom:1px solid rgba(17,17,17,.13); vertical-align:top; font-weight:600; }
.item-code { font-size:17px; color:#8a6a1c; font-weight:700; display:block; }
.item-name { font-weight:600; word-break:break-word; }
.totals-wrap { padding-top:4px; font-size:26px; }
.tot-row { display:flex; justify-content:space-between; padding:4px 0; font-weight:600; }
.tot-row span:first-child { color:#8a6a1c; }
.tot-row.grand { background:linear-gradient(90deg,var(--hdr,#0b0b0c),rgba(var(--hdr-rgb,11,11,12),.82)); font-size:38px; font-weight:800; padding:10px 20px; border-radius:10px; margin:8px 0; border:2px solid #c9a24b; }
.tot-row.grand span:first-child { color:#c9a24b; } .tot-row.grand span:last-child { color:#fff; }
.balance-row { background:#e8cf8a; font-weight:800; padding:8px 16px; border-radius:8px; font-size:26px; }
.foot { display:flex; align-items:center; gap:24px; margin:0 -56px; padding:10px 56px; border-top:5px solid #c9a24b; background:linear-gradient(90deg,rgba(var(--hdr-rgb,11,11,12),.12) 0%,rgba(var(--hdr-rgb,11,11,12),.3) 28%,rgba(var(--hdr-rgb,11,11,12),.82) 55%,rgba(var(--hdr-rgb,11,11,12),.92) 100%),var(--bg-foot,url('../receipt-foot.jpg')) center/cover no-repeat; }
.qrbox { flex:0 0 auto; width:112px; height:112px; border-radius:14px; background:rgba(255,255,255,.9); box-shadow:0 4px 14px rgba(0,0,0,.28); display:flex; align-items:center; justify-content:center; }
.qrbox svg { width:100px; height:100px; display:block; }
.fr { flex:1; text-align:right; }
.thanks { font-weight:700; font-style:italic; font-size:34px; margin-bottom:0; color:#fff; }
.wa { display:inline-block; background:#25D366; color:#06240f; font-weight:800; font-size:25px; padding:8px 22px; border-radius:999px; }
.shop-info { font-size:21px; color:#e8cf8a; margin-top:10px; line-height:1.35; }
.mapfoot { display:flex; align-items:center; gap:22px; margin:0 -56px; padding:14px 56px; background:rgba(246,239,220,.55); border-top:4px solid #c9a24b; color:#3a3f55; }
.mapfoot img { width:120px; height:120px; flex:none; background:rgba(255,255,255,.7); padding:5px; border:2px solid #c9a24b; }
.mapfoot .mt { font-size:22px; line-height:1.4; word-break:break-all; }
.mapfoot .mt b { display:block; font-size:20px; letter-spacing:.08em; color:#0b1b3a; word-break:normal; margin-bottom:2px; }
.mapfoot .mt a { color:#7a5f1f; text-decoration:underline; }
.bar { height:12px; margin:0 -56px; background:linear-gradient(90deg,#c9a24b,#25D366 50%,#c9a24b); }

.top{position:relative}
/* 17 Nov (AJ): a thin white line under the total box, then the header picture runs down behind the thank-you line */
.thanks{margin:0 -56px;border-top:7px solid #fff;text-align:center;font-weight:700;font-style:italic;font-size:30px;color:#fff;padding:40px 0 42px;text-shadow:0 2px 6px rgba(0,0,0,.65);background-color:var(--hdr,#0b0b0c);background-image:linear-gradient(90deg,rgba(var(--hdr-rgb,11,11,12),.82) 0%,rgba(var(--hdr-rgb,11,11,12),.5) 50%,rgba(var(--hdr-rgb,11,11,12),.82) 100%),var(--bg-top,url('../receipt-top.jpg'));background-size:cover,cover;background-position:center bottom;background-repeat:no-repeat}

/* 17 Nov (AJ red circle): the QR fixture sits in the empty middle of the header, between the logo and the picture, above the WhatsApp line */
.fx{position:absolute;left:490px;top:6px;width:200px;height:172px;transform:scale(.76);transform-origin:0 0}
.fx i{position:absolute;display:none;background:linear-gradient(#f4ead0,#c9a24b);box-shadow:0 2px 5px rgba(0,0,0,.35)}
.fx .plate{position:absolute;background:rgba(255,255,255,.92);border:4px solid #c9a24b;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.fx .qrbox{width:104px;height:104px;background:transparent;box-shadow:none;border-radius:6px;display:flex;align-items:center;justify-content:center}.fx .qrbox svg{width:104px;height:104px;display:block}
/* f0 bathtub */
.f0 .plate{left:8px;right:8px;top:44px;height:114px;border-radius:10px 10px 62px 62px/10px 10px 50px 50px}
.f0 .d1{display:block;left:94px;top:2px;width:12px;height:34px;border-radius:6px 6px 0 0}.f0 .d2{display:block;left:0;right:0;top:34px;height:14px;border-radius:8px}
.f0 .d3{display:block;left:34px;top:156px;width:22px;height:12px;border-radius:0 0 10px 10px}.f0 .d4{display:block;right:34px;top:156px;width:22px;height:12px;border-radius:0 0 10px 10px}
/* f1 tap over a basin plate */
.f1 .plate{left:22px;right:22px;top:56px;height:114px;border-radius:24px}
.f1 .d1{display:block;left:40px;top:4px;width:122px;height:16px;border-radius:8px}.f1 .d2{display:block;left:148px;top:4px;width:14px;height:44px;border-radius:0 0 8px 8px}
.f1 .d3{display:block;left:40px;top:20px;width:14px;height:28px;border-radius:4px}.f1 .d4{display:block;left:150px;top:52px;width:9px;height:12px;border-radius:50% 50% 50% 50%/65% 65% 35% 35%;background:#8fd0ee}
/* f2 shower panel with a rain head */
.f2 .plate{left:34px;right:34px;top:30px;height:140px;border-radius:6px}
.f2 .d1{display:block;left:36px;top:0;width:128px;height:14px;border-radius:50%}.f2 .d2{display:block;left:96px;top:12px;width:8px;height:20px}
.f2 .d3{display:block;left:48px;top:16px;width:6px;height:6px;border-radius:50%;background:#8fd0ee;box-shadow:24px 4px 0 #8fd0ee,52px 0 0 #8fd0ee,76px 4px 0 #8fd0ee,100px 0 0 #8fd0ee}
/* f3 wash basin on a pedestal */
.f3 .plate{left:6px;right:6px;top:34px;height:104px;border-radius:26px 26px 90px 90px/18px 18px 50px 50px}
.f3 .d1{display:block;left:94px;top:4px;width:12px;height:30px;border-radius:6px 6px 0 0}.f3 .d2{display:block;left:78px;top:134px;width:44px;height:26px;border-radius:0 0 10px 10px}
.f3 .d3{display:block;left:56px;top:158px;width:88px;height:9px;border-radius:5px}
/* f4 round mirror with a light bar */
.f4 .plate{left:24px;right:24px;top:14px;height:152px;border-radius:50%;border-width:5px}
.f4 .d1{display:block;left:52px;top:0;width:96px;height:9px;border-radius:5px}.f4 .d2{display:block;left:94px;top:164px;width:12px;height:8px;border-radius:0 0 4px 4px}

/* ===== v2 look (22 Nov, AJ: less like paper, more see-through and beautiful) ===== */
.sheet{background:#0b0b0c}
.mid{background:linear-gradient(rgba(11,11,12,.12),rgba(11,11,12,.28)),var(--bg-mid,url('../receipt-mid.jpg')) center/cover no-repeat;padding:18px 40px 26px;margin:0 -56px}
.glass{background:rgba(255,253,247,.66);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1.5px solid rgba(255,255,255,.75);border-radius:28px;box-shadow:0 14px 40px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.9);padding:22px 34px 18px}
.rbar{border-bottom:0;margin:0 0 10px;padding-bottom:0}.rbar .rc{font-size:20px;letter-spacing:.34em;color:#8a6a1c}.rbar .rb{font-size:30px;color:#1a1408;letter-spacing:.01em}
.meta-grid{background:rgba(255,255,255,.55);border:1px solid rgba(201,162,75,.45);border-radius:16px;padding:10px 18px;margin:8px 0 14px}
table{margin:0}th{border-bottom:1.5px solid rgba(201,162,75,.7);font-size:15px;letter-spacing:.16em}
td{border-bottom:1px solid rgba(17,17,17,.08);padding:11px 0}
tbody tr:last-child td{border-bottom:0}
td.num{font-variant-numeric:tabular-nums}
td.listp{color:#6a665c;font-weight:600}td.amt{font-weight:800;color:#1a1408}
.totals-wrap{margin-top:8px;padding-top:12px;border-top:1.5px solid rgba(201,162,75,.7)}
.tot-row span:first-child{color:#6a5a2a}
.tot-row.disc span:last-child{color:#a2362b;font-weight:800}
.save{font-size:19px;color:#2f7d4a;font-weight:700;text-align:right;margin:-2px 0 4px}
.tot-row.grand{background:linear-gradient(135deg,rgba(11,11,12,.92),rgba(40,30,12,.88));border:1.5px solid #d9b45a;border-radius:20px;box-shadow:0 8px 22px rgba(0,0,0,.3);margin:10px 0 2px}
.tot-row.grand{align-items:center}.tot-row.grand span:first-child{letter-spacing:.2em;font-size:26px}
.mapfoot{background:rgba(255,253,247,.78);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
</style>
</head>
<body>
<div class="sheet" id="sheet">
  <div class="top">
    <img src="../receipt-logo-t.png" alt="RBH" class="logo-img">
    <div class="addr" id="addr"></div>
    <div class="fx f0" id="fx"><i class="d1"></i><i class="d2"></i><i class="d3"></i><i class="d4"></i><div class="plate"><div class="qrbox" id="qrContainer"></div></div></div>
  </div>
  <div class="mid">
  <div class="glass">
  <div class="rbar"><span class="rc">RECEIPT</span><span class="rb" id="rbNo"></span></div>
  <div class="meta-grid" id="metaGrid"></div>
  <table>
    <thead><tr><th style="width:46%">Item</th><th class="num" style="width:10%">Qty</th><th class="num" style="width:21%">Price</th><th class="num" style="width:23%">Amount</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <div class="totals-wrap">
    <div class="tot-row"><span>Subtotal</span><span id="sub"></span></div>
    <div class="tot-row disc" id="discRow"><span>Discount</span><span id="disc"></span></div>
    <div class="save" id="saveNote"></div>
    <div class="tot-row grand"><span>TOTAL</span><span id="total"></span></div>
    <div class="tot-row" id="payRow" style="display:none;"><span>Paid by</span><span id="payMethod"></span></div>
    <div class="tot-row balance-row" id="balRow" style="display:none;"><span id="balLabel">Balance Due</span><span id="balVal"></span></div>
  </div>
  </div>
  </div>
  <div class="thanks" id="thanks"></div>
  <div class="mapfoot" id="mapfoot"><img id="mapQr" alt="Map QR"><div class="mt"><b>FIND US ON GOOGLE MAPS</b><span id="mapAddr"></span><br><span id="mapContact"></span><br>Scan the QR code, or open:<br><a id="mapLink"></a></div></div>
  <div class="bar"></div>
</div>

<script>
const n = v => Number(v || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

function renderReceipt(d) {
  // 17 Nov: background set rotates every 2 days (server sends d.set = 1..N; none = the usual look)
  if (d && d.set) { var r = document.documentElement.style, sn = d.set; r.setProperty('--bg-top', "url('../receipt-sets/set" + sn + "_top.jpg')"); r.setProperty('--bg-mid', "url('../receipt-sets/set" + sn + "_mid.jpg')"); r.setProperty('--bg-foot', "url('../receipt-sets/set" + sn + "_foot.jpg')"); }
  if (d && d.hdr) { var rs = document.documentElement.style; rs.setProperty('--hdr', d.hdr); rs.setProperty('--hdr-rgb', d.hdrRgb || '11,11,12'); }
  d = d || {};
  const $ = id => document.getElementById(id);

  const metaData = [
    ['Date', d.date || '-'],
    ['Customer', d.customer || '-'],
    ['Phone', d.customerPhone || '-']
  ];

  $('rbNo').textContent = d.billNo ? 'Bill #' + d.billNo : '';
  $('addr').innerHTML = (d.address || 'No. 173/1, Kandy Road, Thihariya, Kalagedihena, Sri Lanka') + '<br>Phone / WhatsApp <b>' + (d.phone || '+94 74 035 5536') + '</b>';
  const metaGrid = $('metaGrid');
  metaGrid.innerHTML = '';
  metaData.forEach(([label, val]) => {
    const itemDiv = document.createElement('div');
    itemDiv.className = 'meta-item';
    
    const labelSpan = document.createElement('span');
    labelSpan.className = 'meta-label';
    labelSpan.textContent = label;
    
    const valSpan = document.createElement('span');
    valSpan.className = 'meta-val';
    valSpan.textContent = val;
    
    itemDiv.appendChild(labelSpan);
    itemDiv.appendChild(valSpan);
    metaGrid.appendChild(itemDiv);
  });

  $('rows').innerHTML = '';
  let sub = 0;
  const gross = (d.items || []).reduce((s, it) => s + (it.qty || 0) * (it.price || 0), 0);
  const offered = d.total != null ? Math.max(0, gross - Number(d.total)) : Number(d.discount || 0);
  const keep = gross > 0 ? (gross - offered) / gross : 1;
  let used = 0; const nItems = (d.items || []).length;
  (d.items || []).forEach((it, ix) => {
    const list = (it.qty || 0) * (it.price || 0);
    const amt = ix === nItems - 1 ? Math.round(gross - offered - used) : Math.round(list * keep);
    used += amt; sub += list;
    const tr = document.createElement('tr');
    
    const tdItem = document.createElement('td');
    if (it.code) {
      const codeSpan = document.createElement('span');
      codeSpan.className = 'item-code';
      codeSpan.textContent = '[' + it.code + ']';
      tdItem.appendChild(codeSpan);
    }
    const nameSpan = document.createElement('span');
    nameSpan.className = 'item-name';
    nameSpan.textContent = it.name || '-';
    tdItem.appendChild(nameSpan);
    tr.appendChild(tdItem);

    const tdQty = document.createElement('td');
    tdQty.className = 'num';
    tdQty.textContent = it.qty || 0;
    tr.appendChild(tdQty);

    const tdPrice = document.createElement('td');
    tdPrice.className = 'num listp';
    tdPrice.textContent = n(amt / (it.qty || 1));   // 24 Nov (AJ): customer sees the price he pays per piece, never the marked price
    tr.appendChild(tdPrice);

    const tdAmt = document.createElement('td');
    tdAmt.className = 'num amt';
    tdAmt.textContent = n(amt);
    tr.appendChild(tdAmt);

    $('rows').appendChild(tr);
  });

  const finalTotal = d.total != null ? Number(d.total) : sub - offered;
  $('sub').parentElement.style.display = 'none';   // 24 Nov (AJ): no Subtotal, no Discount, no "You saved": only the lines and the total, like the paper bill
  $('discRow').style.display = 'none';
  $('total').textContent = 'Rs. ' + n(finalTotal);
  $('saveNote').textContent = '';

  const payMethod = String(d.paymentMethod || '').trim().toLowerCase();
  if (payMethod && payMethod !== 'unknown' && payMethod !== 'cash') {
    $('payRow').style.display = 'flex';
    $('payMethod').textContent = payMethod === 'split' ? 'SPLIT PAYMENT' : payMethod.toUpperCase();
  } else {
    $('payRow').style.display = 'none';
  }

  if (payMethod === 'credit') {
    $('balRow').style.display = 'flex';
    $('balVal').textContent = 'Rs. ' + n(finalTotal);
  } else if (d.balanceDue != null && Number(d.balanceDue) > 0) {
    $('balRow').style.display = 'flex';
    $('balVal').textContent = 'Rs. ' + n(d.balanceDue);
  } else {
    $('balRow').style.display = 'none';
  }

  $('thanks').textContent = d.thanks || 'Thank you for choosing Royal Bath Hub';
  

  // Official footer: Google Maps link + QR (utils/shopInfo.js); the QR picture is waited for before the screenshot
  const mapUrl = String(d.mapsUrl || '').replace(/&amp;/g, '&');
  $('mapfoot').style.display = mapUrl ? 'flex' : 'none';
  $('mapLink').textContent = mapUrl; $('mapLink').href = mapUrl;
  $('mapAddr').innerHTML = d.address || ''; $('mapContact').innerHTML = (d.phone ? 'Phone / WhatsApp: ' + d.phone : '') + (d.email ? ' &nbsp;|&nbsp; ' + d.email : '');
  $('fx').className = 'fx f' + ((d.frame | 0) % 5);
  if (d.qrSvg) {
    $('qrContainer').innerHTML = d.qrSvg;
  }

  const qi = $('mapQr'), done = () => { document.body.dataset.ready = '1'; };
  if (d.qr) { qi.src = d.qr; if (!qi.complete) { qi.onload = done; qi.onerror = done; } else done(); } else { qi.style.display = 'none'; done(); }
}

document.fonts.ready.then(() => renderReceipt(window.RECEIPT_DATA));
</script>
</body>
</html>
