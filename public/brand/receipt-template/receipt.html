<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Royal Bath Hub Receipt</title>
<style>
@font-face {
  font-family: 'Inter';
  font-style: normal;
  font-weight: 400;
  src: local('Arial');
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  width: 1122px;
  margin: 0;
  background-color: #0b0b0c;
  color: #111111;
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  font-size: 31px;
  line-height: 1.35;
  padding: 0;
  display: flex;
  justify-content: center;
}
.sheet {
  background: #ffffff;
  border-radius: 0;
  border: none;
  padding: 52px 64px 56px;
  position: relative;
  width: 1122px;
  box-shadow: none;
}
.header {
  background: #0b0b0c;
  border-radius: 16px;
  border: 4px solid #c9a24b;
  padding: 16px 34px;
  text-align: center;
  margin-bottom: 24px;
  box-shadow: 0 12px 22px rgba(5,12,35,.35);
}
.logo-img {
  max-width: 100%;
  height: 150px;
  width: auto;
  display: block;
  margin: 0 auto;
}
.receipt-bar {
  background: #c9a24b;
  color: #0b0b0c;
  font-weight: 700;
  font-size: 24px;
  letter-spacing: 0.1em;
  text-align: center;
  padding: 6px 0;
  border-radius: 6px;
  margin-bottom: 20px;
  text-transform: uppercase;
}
.meta-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px 16px;
  font-size: 30px;
  border-bottom: 3px dashed #b99a4f;
  padding-bottom: 18px;
  margin-bottom: 18px;
}
.meta-item { display: flex; flex-direction: column; }
.meta-label { color: #7a5f1f; font-size: 20px; font-weight: 600; text-transform: uppercase; }
.meta-val { font-weight: 700; color: #111111; word-break: break-word; }

table {
  width: 100%;
  border-collapse: collapse;
  margin-bottom: 16px;
  font-size: 31px;
}
th {
  color: #7a5f1f;
  font-size: 20px;
  text-transform: uppercase;
  border-bottom: 2px solid #c9a24b;
  padding-bottom: 12px;
  text-align: left;
  letter-spacing: .1em;
}
th.num, td.num { text-align: right; }
td {
  padding: 12px 0;
  border-bottom: 1px solid rgba(17,17,17,0.15);
  vertical-align: top;
  font-weight: 600;
  color: #111111;
}
.item-code { font-size: 20px; color: #7a5f1f; font-weight: 600; display: block; }
.item-name { font-weight: 600; color: #111111; word-break: break-word; }

.totals-wrap {
  border-top: 2px solid #c9a24b;
  padding-top: 12px;
  font-size: 31px;
}
.tot-row {
  display: flex;
  justify-content: space-between;
  padding: 6px 0;
  font-weight: 600;
  color: #111111;
}
.tot-row span:first-child { color: #7a5f1f; }
.tot-row.grand {
  background: #0b0b0c;
  color: #c9a24b;
  font-size: 42px;
  font-weight: 700;
  padding: 12px 20px;
  border-radius: 8px;
  margin: 12px 0;
  border-top: 2px solid #c9a24b;
  border-bottom: 2px solid #c9a24b;
}
.tot-row.grand span:last-child { color: #ffffff; }
.balance-row {
  background: #e8cf8a;
  color: #111111;
  font-weight: 700;
  padding: 8px 14px;
  border-radius: 6px;
  font-size: 26px;
}

.footer {
  margin-top: 24px;
  border-top: 3px dashed #b99a4f;
  padding-top: 20px;
  text-align: center;
}
.thanks { font-weight: 500; font-style: italic; font-size: 40px; color: #111111; margin-bottom: 8px; }
.shop-info { font-size: 26px; color: #444444; line-height: 1.35; }
.qr-wrap {
  margin-top: 16px;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 16px;
}
.qr-container { width: 110px; height: 110px; border: 2px solid #c9a24b; border-radius: 8px; padding: 4px; background: #fff; display: flex; align-items: center; justify-content: center; }
.qr-container svg { width: 100%; height: 100%; }
.qr-text { font-size: 20px; color: #7a5f1f; text-align: left; font-weight: 600; }
.gold-bar { height: 8px; background: #c9a24b; border-radius: 4px; margin-top: 20px; }
</style>
</head>
<body>
<div class="sheet" id="sheet">
  <div class="header">
    <img src="../../receipt-logo.png" alt="RBH" class="logo-img">
  </div>

  <div class="receipt-bar">RECEIPT</div>

  <div class="meta-grid" id="metaGrid"></div>

  <table>
    <thead>
      <tr>
        <th style="width: 44%;">Item</th>
        <th class="num" style="width: 12%;">Qty</th>
        <th class="num" style="width: 22%;">Price</th>
        <th class="num" style="width: 22%;">Amount</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>

  <div class="totals-wrap">
    <div class="tot-row"><span>Subtotal</span><span id="sub"></span></div>
    <div class="tot-row" id="discRow"><span>Discount</span><span id="disc"></span></div>
    <div class="tot-row grand"><span>TOTAL</span><span id="total"></span></div>
    <div class="tot-row" id="payRow" style="display:none;"><span>Paid by</span><span id="payMethod"></span></div>
    <div class="tot-row balance-row" id="balRow" style="display:none;">
      <span id="balLabel">Balance Due</span><span id="balVal"></span>
    </div>
  </div>

  <div class="footer">
    <div class="thanks" id="thanks"></div>
    <div class="shop-info" id="shopInfo"></div>
    <div class="qr-wrap">
      <div class="qr-container" id="qrContainer"></div>
      <div class="qr-text">Scan to Chat<br>074 035 5536</div>
    </div>
    <div class="gold-bar"></div>
  </div>
</div>

<script>
const n = v => Number(v || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

function renderReceipt(d) {
  d = d || {};
  const $ = id => document.getElementById(id);

  const metaData = [
    ['Bill No.', d.billNo ? '#' + d.billNo : '-'],
    ['Date', d.date || '-'],
    ['Customer', d.customer || '-'],
    ['Phone', d.customerPhone || '-']
  ];

  const metaGrid = $('metaGrid');
  metaGrid.innerHTML = '';
  metaData.forEach(([label, val]) => {
    const itemDiv = document.createElement('div');
    itemDiv.className = 'meta-item';
    
    const labelSpan = document.createElement('span');
    labelSpan.className = 'meta-label';
    labelSpan.textContent = label;
    
    const valSpan = document.createElement('span');
    valSpan.className = 'meta-val';
    valSpan.textContent = val;
    
    itemDiv.appendChild(labelSpan);
    itemDiv.appendChild(valSpan);
    metaGrid.appendChild(itemDiv);
  });

  $('rows').innerHTML = '';
  let sub = 0;
  (d.items || []).forEach(it => {
    const amt = (it.qty || 0) * (it.price || 0);
    sub += amt;
    const tr = document.createElement('tr');
    
    const tdItem = document.createElement('td');
    if (it.code) {
      const codeSpan = document.createElement('span');
      codeSpan.className = 'item-code';
      codeSpan.textContent = '[' + it.code + ']';
      tdItem.appendChild(codeSpan);
    }
    const nameSpan = document.createElement('span');
    nameSpan.className = 'item-name';
    nameSpan.textContent = it.name || '-';
    tdItem.appendChild(nameSpan);
    tr.appendChild(tdItem);

    const tdQty = document.createElement('td');
    tdQty.className = 'num';
    tdQty.textContent = it.qty || 0;
    tr.appendChild(tdQty);

    const tdPrice = document.createElement('td');
    tdPrice.className = 'num';
    tdPrice.textContent = n(it.price);
    tr.appendChild(tdPrice);

    const tdAmt = document.createElement('td');
    tdAmt.className = 'num';
    tdAmt.textContent = n(amt);
    tr.appendChild(tdAmt);

    $('rows').appendChild(tr);
  });

  const disc = Number(d.discount || 0);
  const calculatedTotal = sub - disc;
  const finalTotal = d.total != null ? Number(d.total) : calculatedTotal;

  $('sub').textContent = 'Rs. ' + n(sub);
  if (disc > 0) {
    $('discRow').style.display = 'flex';
    $('disc').textContent = '- Rs. ' + n(disc);
  } else {
    $('discRow').style.display = 'none';
  }
  $('total').textContent = 'Rs. ' + n(finalTotal);

  const payMethod = String(d.paymentMethod || '').trim().toLowerCase();
  if (payMethod && payMethod !== 'unknown' && payMethod !== 'cash') {
    $('payRow').style.display = 'flex';
    $('payMethod').textContent = payMethod === 'split' ? 'SPLIT PAYMENT' : payMethod.toUpperCase();
  } else {
    $('payRow').style.display = 'none';
  }

  if (payMethod === 'credit') {
    $('balRow').style.display = 'flex';
    $('balVal').textContent = 'Rs. ' + n(finalTotal);
  } else if (d.balanceDue != null && Number(d.balanceDue) > 0) {
    $('balRow').style.display = 'flex';
    $('balVal').textContent = 'Rs. ' + n(d.balanceDue);
  } else {
    $('balRow').style.display = 'none';
  }

  $('thanks').textContent = d.thanks || 'Thank you for choosing Royal Bath Hub';
  
  const shopInfo = (d.address || 'No. 173/1, Kandy Road, Thihariya, Kalagedihena') + '<br>WhatsApp: ' + (d.phone || '074 035 5536');
  $('shopInfo').innerHTML = shopInfo;

  if (d.qrSvg) {
    $('qrContainer').innerHTML = d.qrSvg;
  }

  document.body.dataset.ready = '1';
}

document.fonts.ready.then(() => renderReceipt(window.RECEIPT_DATA));
</script>
</body>
</html>
