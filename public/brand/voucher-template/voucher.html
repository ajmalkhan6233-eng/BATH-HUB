<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Payment Voucher</title>
<style>
*{box-sizing:border-box}
html,body{margin:0}
body{width:800px;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#14213d;background:#0b1b3a;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.sheet{position:relative;overflow:hidden;background:#fbf6e9}
.bgimg{position:absolute;inset:0;background-size:cover;background-position:center;filter:blur(2px) saturate(1.2);transform:scale(1.04);opacity:1}
.bgfall{z-index:0;position:absolute;inset:0;background:radial-gradient(circle at 12% 8%,#2ea39b55 0,#0000 38%),radial-gradient(circle at 92% 30%,#e0b95a66 0,#0000 34%),radial-gradient(circle at 20% 95%,#3f7fd144 0,#0000 40%),linear-gradient(160deg,#eaf6f1,#fbf6e9 55%,#f6e7bd)}
.bgveil{position:absolute;inset:0;background:linear-gradient(180deg,#fbf6e900 0,#fbf6e922 50%,#fbf6e955 100%)}
.top{position:relative;background:linear-gradient(120deg,#0b1b3a66,#12455a60 60%,#1c7a7858);color:#e0b95a;padding:26px 34px;backdrop-filter:blur(2px);display:flex;justify-content:space-between;align-items:center}
.top img{height:78px;max-width:330px;object-fit:contain;filter:drop-shadow(0 4px 6px #0008) drop-shadow(0 0 1px #0006)}
.top .t{text-align:right}
.top .t small{display:block;letter-spacing:4px;font-size:13px;font-weight:700;color:#ffffff;text-shadow:0 2px 8px #000,0 0 3px #000}
.top .t b{display:block;font:700 28px Georgia,serif;margin-top:4px;color:#ffe08a;text-shadow:0 2px 8px #000,0 0 3px #000}
.gold{position:relative;height:8px;background:linear-gradient(90deg,#c9a24bcc,#f2d98acc,#c9a24bcc)}
.body{position:relative;padding:24px 24px 30px}
.row{display:flex;gap:16px}
.card{flex:1;background:#ffffff96;border:1px solid #e2d4a8;border-radius:14px;padding:14px 18px;box-shadow:0 6px 18px #0b1b3a22}
.card small{display:block;font-size:11px;letter-spacing:2px;color:#0f6a68;font-weight:700}
.card b{text-shadow:0 0 6px #fff9;display:block;font:700 20px Georgia,serif;margin-top:6px}
.card span{display:block;font-size:13px;color:#46506a;margin-top:3px}
h3{display:inline-block;margin:22px 0 8px;font-size:12px;letter-spacing:3px;color:#0b4f4d;background:#ffffffe6;padding:5px 12px;border-radius:99px;border:1px solid #e2d4a8}
table{width:100%;border-collapse:separate;border-spacing:0;border-radius:12px;overflow:hidden;border:1px solid #c9a24b;background:#ffffff98}
th{background:#0b1b3acc;color:#ffffff;font-size:10.5px;font-weight:700;letter-spacing:1.5px;text-align:left;padding:10px;text-shadow:0 1px 3px #000}
td{padding:9px 10px;font-size:13px;font-weight:500;text-shadow:0 0 5px #fff8;border-bottom:1px solid #efe6c9}
tr:nth-child(even) td{background:#fbf6e99a}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td:first-child{white-space:nowrap}
tr.sum td{background:#0b1b3ae0;color:#fff;font-weight:700;border:0}
.totals{margin-top:20px;display:flex;gap:12px}
.t3{flex:1;border-radius:14px;padding:14px 16px;color:#fff;box-shadow:0 8px 20px #0b1b3a33}
.t3 small{display:block;font-size:11px;letter-spacing:2px;opacity:1;font-weight:700;text-shadow:0 1px 4px #000a}
.t3 b{text-shadow:0 1px 5px #000a;display:block;font:700 22px Georgia,serif;margin-top:6px}
.a{background:linear-gradient(135deg,#14213d80,#254a7a80)}
.b{background:linear-gradient(135deg,#0f6a6880,#2ea39b80)}
.c{background:linear-gradient(135deg,#f59e0bdd,#fcd34ddd);color:#1a1405}.c small,.c b{text-shadow:0 1px 3px #fff8}
.note{margin-top:12px;font-size:13px;color:#2a3350;text-shadow:0 0 6px #fffc;font-weight:500}
.xsig{display:flex;gap:40px;margin-top:34px}
.sig div{flex:1;border-top:2px solid #c9a24b;padding-top:7px;font-size:12px;line-height:1.6;color:#2a3350;text-shadow:0 0 6px #fffb}.sig b{font-size:13px;color:#14213d}
.foot{position:relative;background:#0b1b3ae6;color:#ffffff;font-weight:600;text-align:center;font-size:12px;padding:12px;letter-spacing:1px}
.endcard{margin-top:16px;background:#ffffffee;border:1px solid #e2d4a8;border-radius:14px;padding:14px 18px;font-size:13px;line-height:1.6;color:#14213d;box-shadow:0 6px 18px #0b1b3a22}
.endcard #words{margin-top:6px;font-weight:600}
.who{display:flex;justify-content:space-between;gap:20px;margin-top:10px;padding-top:10px;border-top:1px solid #e2d4a8}
.who b{color:#0b1b3a}
tfoot td{font-size:14px}
</style></head><body>
<div class="sheet" id="sheet">
<div class="bgfall"></div><div class="bgimg" id="bg"></div><div class="bgveil"></div>
<div class="top"><img id="logo" alt="Royal Bath Hub"><div class="t"><small>PAYMENT VOUCHER</small><b id="vno"></b></div></div>
<div class="gold"></div>
<div class="body">
<div class="row">
<div class="card"><small>PAY TO</small><b id="vendor"></b><span id="vphone"></span></div>
<div class="card"><small>PAID BY</small><b id="shop"></b><span id="addr"></span><span id="date"></span></div>
</div>
<h3>ACCOUNT STATEMENT (CREDITOR)</h3>
<table><thead><tr><th>DATE</th><th>REFERENCE</th><th>PARTICULARS</th><th class="n">DEBIT (RS.)</th><th class="n">CREDIT (RS.)</th><th class="n">BALANCE (RS.)</th></tr></thead><tbody id="led"></tbody><tfoot><tr class="sum"><td colspan="3">TOTAL</td><td class="n" id="sd"></td><td class="n" id="sc"></td><td class="n" id="sb"></td></tr></tfoot></table>
<div class="totals">
<div class="t3 a"><small>TOTAL CREDIT (INVOICES)</small><b id="tb"></b></div>
<div class="t3 b"><small>TOTAL DEBIT (CHEQUES)</small><b id="tc"></b></div>
<div class="t3 c"><small>BALANCE PAYABLE (CR)</small><b id="tr"></b></div>
</div>
<div class="endcard"><div id="note"></div><div id="words"></div><div class="who"><span>Issued by: <b id="sigA"></b></span><span>Received by: <b id="sigB"></b></span></div></div>
</div>
<div class="foot" id="foot"></div>
</div>
<script>
// The server swaps the sample between the two markers. Designers: keep the markers and the field names.
const VOUCHER = /*DATA*/{"voucher_no":"PV-SAMPLE","date":"11 Nov 2026","shop":{"name":"Royal Bath Hub","address":"No. 173/1, Kandy Road, Thihariya","phone":"074 035 5536"},"vendor":{"name":"Fawaz (Fazaal Hardware Pvt Ltd)","phone":""},"received_by":"Mr. Fawaz, Fazaal Hardware (Pvt) Ltd","bills":[{"grn_no":"GRN-0001","bill_no":"G1CR008289","bill_date":"2026-10-20","total":292450}],"cheques":[{"no":"704927","bank":"HNB","date":"2027-02-04","amount":150000}],"bills_total":292450,"cheques_total":150000,"balance":142450,"logo":"","bg":""}/*END*/;
const $=id=>document.getElementById(id),esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=n=>Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const day=d=>{const x=new Date(String(d).slice(0,10)+'T00:00:00');return isNaN(x)?esc(d||''):x.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})};
const V=VOUCHER;
if(V.logo)$('logo').src=V.logo;else $('logo').style.display='none';
if(V.bg)$('bg').style.backgroundImage='url("'+V.bg+'")';
$('vno').textContent=V.voucher_no;$('vendor').textContent=V.vendor.name;$('vphone').textContent=V.vendor.phone||'';
$('shop').textContent=V.shop.name;$('addr').textContent=V.shop.address;$('date').textContent='Date: '+V.date;
const rows=[];V.bills.forEach(b=>rows.push({d:String(b.bill_date).slice(0,10),ref:(b.grn_no?b.grn_no+' / ':'')+b.bill_no,txt:'Purchase invoice (GRN)',dr:0,cr:Number(b.total)}));
V.cheques.forEach(c=>rows.push({d:String(c.date).slice(0,10),ref:'Cheque '+c.no,txt:'Paid by cheque, '+esc(String(c.bank||'').replace('Hatton National Bank','HNB')),dr:Number(c.amount),cr:0}));
rows.sort((x,y)=>x.d<y.d?-1:x.d>y.d?1:(x.cr?-1:1));let run=0;
$('led').innerHTML=rows.map(r=>{run+=r.cr-r.dr;return '<tr><td>'+day(r.d)+'</td><td><b>'+esc(r.ref)+'</b></td><td>'+r.txt+'</td><td class="n">'+(r.dr?money(r.dr):'')+'</td><td class="n">'+(r.cr?money(r.cr):'')+'</td><td class="n">'+money(Math.abs(run))+(run>=0?' Cr':' Dr')+'</td></tr>'}).join('');
$('sd').textContent=money(V.cheques_total);$('sc').textContent=money(V.bills_total);$('sb').textContent=money(Math.abs(V.balance))+(V.balance>=0?' Cr':' Dr');
$('tb').textContent='Rs. '+money(V.bills_total);$('tc').textContent='Rs. '+money(V.cheques_total);$('tr').textContent='Rs. '+money(V.balance);
const W1=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'],W2=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
const w3=n=>{let s='';if(n>=100){s+=W1[Math.floor(n/100)]+' Hundred';n%=100;if(n)s+=' and '}if(n>=20){s+=W2[Math.floor(n/10)]+(n%10?' '+W1[n%10]:'')}else if(n)s+=W1[n];return s};
const words=x=>{x=Math.round(Number(x||0)*100);let r=Math.floor(x/100),c=x%100;if(!r&&!c)return 'Rupees Zero Only';const P=[[1e6,'Million'],[1e3,'Thousand']];let o=[];for(const[v,nm]of P){if(r>=v){o.push(w3(Math.floor(r/v))+' '+nm);r%=v}}if(r)o.push(w3(r));let t='Rupees '+o.join(' ').replace(/ Thousand (\w+ Hundred)/,' Thousand $1');if(c)t+=' and '+w3(c)+' Cents';return t+' Only'};
$('note').textContent='Being payment by cheque in settlement of the invoices above. Debit = cheques paid, Credit = invoices received. Cheques are dated as shown.';
$('words').textContent='Total debit: '+words(V.cheques_total)+(V.balance>0?'. Balance payable (Cr): '+words(V.balance)+'.':'. Paid in full.');
$('sigA').textContent=V.shop.name;$('sigB').textContent=V.received_by||V.vendor.name;
$('foot').textContent=V.shop.name+'  |  '+V.shop.address+'  |  '+V.shop.phone;
</script></body></html>
