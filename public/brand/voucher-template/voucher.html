<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vendor statement</title>
<style>
*{box-sizing:border-box}
html,body{margin:0}
body{width:800px;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#14213d;background:#0b1b3a;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.sheet{position:relative;overflow:hidden;background:#fbf6e9}
.bgimg{position:absolute;inset:0;background-size:cover;background-position:center;filter:blur(2px) saturate(1.2);transform:scale(1.04);opacity:1}
.bgfall{z-index:0;position:absolute;inset:0;background:radial-gradient(circle at 12% 8%,#2ea39b55 0,#0000 38%),radial-gradient(circle at 92% 30%,#e0b95a66 0,#0000 34%),radial-gradient(circle at 20% 95%,#3f7fd144 0,#0000 40%),linear-gradient(160deg,#eaf6f1,#fbf6e9 55%,#f6e7bd)}
.bgveil{position:absolute;inset:0;background:linear-gradient(180deg,#fbf6e900 0,#fbf6e911 50%,#fbf6e933 100%)}
.top{position:relative;background:linear-gradient(120deg,rgba(var(--hdr-rgb,11,27,58),.92),rgba(var(--hdr-rgb,11,27,58),.78) 60%,rgba(var(--hdr-rgb,11,27,58),.55));color:#e0b95a;padding:26px 34px;backdrop-filter:blur(2px);display:flex;justify-content:space-between;align-items:center}
.top img{height:78px;max-width:330px;object-fit:contain;filter:drop-shadow(0 4px 6px #0008) drop-shadow(0 0 1px #0006)}
.top .t{text-align:right}
.top .t small{display:block;letter-spacing:4px;font-size:13px;font-weight:700;color:#ffffff;text-shadow:0 2px 8px #000,0 0 3px #000}
.top .t b{display:block;font:700 28px Georgia,serif;margin-top:4px;color:#ffe08a;text-shadow:0 2px 8px #000,0 0 3px #000}
.gold{position:relative;height:8px;background:linear-gradient(90deg,#c9a24bcc,#f2d98acc,#c9a24bcc)}
.body{position:relative;padding:24px 24px 30px}
.row{display:flex;gap:16px}
.card{flex:1;background:#ffffff7a;border:1px solid #e2d4a8;border-radius:14px;padding:14px 18px;box-shadow:0 6px 18px #0b1b3a22}
.card small{display:block;font-size:11px;letter-spacing:2px;color:#0f6a68;font-weight:700}
.card b{text-shadow:0 0 6px #fff9;display:block;font:700 20px Georgia,serif;margin-top:6px}
.card span{display:block;font-size:13px;color:#46506a;margin-top:3px}
h3{display:inline-block;margin:22px 0 8px;font-size:12px;letter-spacing:3px;color:#0b4f4d;background:#ffffffe6;padding:5px 12px;border-radius:99px;border:1px solid #e2d4a8}
table{width:100%;border-collapse:separate;border-spacing:0;border-radius:12px;overflow:hidden;border:1px solid #c9a24b;background:#ffffff80}
th{background:rgba(var(--hdr-rgb,11,27,58),.92);color:#ffffff;font-size:10.5px;font-weight:700;letter-spacing:1.5px;text-align:left;padding:10px 12px;text-shadow:0 1px 3px #000}
td{padding:10px 12px;font-size:14px;font-weight:500;text-shadow:0 0 5px #fff8;border-bottom:1px solid #efe6c9}
tr:nth-child(even) td{background:#fbf6e977}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td:first-child{white-space:nowrap}
tr.sum td{background:rgba(var(--hdr-rgb,11,27,58),.94);color:#fff;font-weight:700;border:0}
.totals{margin-top:20px;display:flex;gap:12px}
.t3{flex:1;border-radius:14px;padding:14px 16px;color:#fff;box-shadow:0 8px 20px #0b1b3a33}
.t3 small{display:block;font-size:11px;letter-spacing:2px;opacity:1;font-weight:700;text-shadow:0 1px 4px #000a}
.t3 b{text-shadow:0 1px 5px #000a;display:block;font:700 22px Georgia,serif;margin-top:6px}
.a{background:linear-gradient(135deg,#14213d80,#254a7a80)}
.b{background:linear-gradient(135deg,#0f6a6880,#2ea39b80)}
.c{background:linear-gradient(135deg,#f59e0bdd,#fcd34ddd);color:#1a1405}.c small,.c b{text-shadow:0 1px 3px #fff8}
.note{margin-top:12px;font-size:13px;color:#2a3350;text-shadow:0 0 6px #fffc;font-weight:500}
.xsig{display:flex;gap:40px;margin-top:34px}
.sig div{flex:1;border-top:2px solid #c9a24b;padding-top:7px;font-size:12px;line-height:1.6;color:#2a3350;text-shadow:0 0 6px #fffb}.sig b{font-size:13px;color:#14213d}
.foot{position:relative;background:#0b1b3ae6;color:#ffffff;font-weight:600;text-align:center;font-size:12px;padding:12px;letter-spacing:1px}
.endcard{margin-top:16px;background:#ffffffdd;border:1px solid #e2d4a8;border-radius:14px;padding:14px 18px;font-size:13px;line-height:1.6;color:#14213d;box-shadow:0 6px 18px #0b1b3a22}
.endcard #words{margin-top:6px;font-weight:600}
.who{display:flex;justify-content:space-between;gap:20px;margin-top:10px;padding-top:10px;border-top:1px solid #e2d4a8}
.who b{color:#0b1b3a}
tfoot td{font-size:14px}
.settle{background:#ffffffcc;border:1px solid #c9a24b;border-radius:14px;padding:6px 18px;box-shadow:0 6px 18px #0b1b3a22}
.sr{display:flex;justify-content:space-between;align-items:center;padding:11px 0;font-size:15px;border-bottom:1px solid #efe6c9;color:#14213d}
.sr b{font-variant-numeric:tabular-nums;font-size:16px}
.sr.bal{border-bottom:0;margin:6px -18px 0;padding:14px 18px;background:linear-gradient(135deg,#f59e0bee,#fcd34dee);border-radius:0 0 13px 13px;font-size:16px;font-weight:700}
.sr.bal b{font:700 24px Georgia,serif;border-bottom:4px double #14213d;padding-bottom:2px}

/* 3D look: raised glass, bevel highlights, layered shadows */
.card,table,.settle,.endcard{box-shadow:inset 0 2px 0 #ffffffcc,inset 0 -3px 0 #0b1b3a22,0 3px 0 #c9a24b66,0 20px 34px -10px #0b1b3a88,0 8px 12px #0b1b3a33}
.card,.settle,.endcard{background-image:linear-gradient(180deg,#ffffff55,#ffffff00 45%)}
th{background-image:linear-gradient(180deg,#ffffff33,#ffffff00 60%);box-shadow:inset 0 1px 0 #ffffff55}
tr.sum td{background-image:linear-gradient(180deg,#ffffff2a,#ffffff00 70%);box-shadow:inset 0 1px 0 #ffffff44}
td{box-shadow:inset 0 1px 0 #ffffff99}
h3{box-shadow:inset 0 2px 0 #fff,0 4px 0 #c9a24b88,0 10px 14px #0b1b3a44}
.gold{box-shadow:0 3px 0 #8a6a1c,0 8px 14px #0b1b3a66;background-image:linear-gradient(180deg,#fff6,#0002)}
.top{box-shadow:inset 0 -3px 0 #0003,inset 0 2px 0 #ffffff44}
.sr.bal{box-shadow:inset 0 2px 0 #ffffffaa,inset 0 -3px 0 #a8610022;background-image:linear-gradient(180deg,#fff7,#fff0 55%),linear-gradient(135deg,#f59e0bee,#fcd34dee)}
.top img{filter:drop-shadow(0 6px 4px #000a) drop-shadow(0 0 2px #ffe08a88)}
.foot{box-shadow:inset 0 2px 0 #ffffff33,0 -6px 14px #0b1b3a55}

#shop{font:900 26px/1.2 Georgia,serif;text-transform:uppercase;letter-spacing:2px;white-space:nowrap;margin-top:8px;color:transparent;
 background:linear-gradient(180deg,#f3c94f 0%,#d9a02a 32%,#a87414 55%,#f0c24a 75%,#8a5e0e 100%);-webkit-background-clip:text;background-clip:text;
 -webkit-text-stroke:.5px #5e400c}

.row .card:first-child{border-color:#e0b95a;background-image:linear-gradient(180deg,#ffffff30,#ffffff00 50%),linear-gradient(135deg,#1f4a7a8c,#1c7a7880)}
.row .card:first-child small{color:#ffe08a}
.row .card:first-child span{color:#e6eef0}
.row .card:first-child #shop{font-size:23px;letter-spacing:2px;background:linear-gradient(180deg,#fffbd0 0%,#ffe27a 30%,#e8b030 56%,#fff0a0 80%,#d9a02a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:.8px #6b4a0d;text-shadow:none;filter:drop-shadow(0 1px 0 #6b4a0d) drop-shadow(0 2px 0 #54390a) drop-shadow(0 3px 1px #0006)}
.pair{display:flex;gap:14px;align-items:flex-start}.col{flex:1;min-width:0}.pair th{padding:9px 7px;font-size:9.5px;letter-spacing:1px}.pair td{padding:8px 7px;font-size:12.5px}.pair td:first-child{white-space:normal}.pair small{display:block;font-size:10.5px;color:#46506a;font-weight:500}.pair h3{margin-top:22px}
/* 24 Nov (AJ): per-bill statement layout, same vivid receipt look (picture, see-through cards, gold logo, amber balance) */
.bill{margin-top:6px}
.bill h3{margin:20px 0 8px}
.settle .sr.sub{font-weight:700;color:#0b4f4d;font-size:13px;letter-spacing:1px;padding:9px 0 5px;border-bottom:1px solid #c9a24b}
.settle .sr.tot{font-weight:700;border-bottom:1px solid #c9a24b}
.settle .sr span small{display:block;font-size:11.5px;color:#46506a;font-weight:500}
.led td,.led th{padding:8px 7px;font-size:12.5px}.led td:nth-child(2){white-space:normal}.led th:nth-child(2){text-align:left}.led small{display:block;font-size:10.5px;color:#46506a;font-weight:500}.led td.pd{color:#7a4b00}.due{margin-top:22px}
.due .sr.bal{margin:0;border-radius:13px;font-size:17px}
.due .sr.bal b{font-size:26px}
.addr{font-size:12.5px;color:#e6eef0;margin-top:4px;line-height:1.5}
.thanks{position:relative;background:#0b1b3ae6;color:#fff;text-align:center;font-size:13px;padding:13px;letter-spacing:.5px}
</style></head><body>
<div class="sheet" id="sheet">
<div class="bgfall"></div><div class="bgimg" id="bg"></div><div class="bgveil"></div>
<div class="top"><img id="logo" alt="Royal Bath Hub"><div class="t"><small>VENDOR STATEMENT</small><b id="vno"></b></div></div>
<div class="gold"></div>
<div class="body">
<div class="row">
<div class="card"><small>FROM</small><b id="shop"></b><span id="addr"></span></div>
<div class="card"><small>TO</small><b id="vendor"></b><span id="date"></span></div>
</div>
<h3>STATEMENT OF ACCOUNT</h3><table class="led"><thead><tr><th>DATE</th><th>DETAILS</th><th class="n">DEBIT</th><th class="n">CREDIT</th><th class="n">BALANCE</th></tr></thead><tbody id="led"></tbody><tfoot><tr class="sum"><td colspan="2">TOTAL (RS.)</td><td class="n" id="tdr"></td><td class="n" id="tcr"></td><td class="n" id="tbl"></td></tr></tfoot></table>
<h3>SUMMARY</h3><div class="settle" id="sumry"></div>
<div class="settle due"><div class="sr bal"><span id="duel"></span><b id="dueb"></b></div></div>
<div class="endcard"><div id="note"></div></div>
</div>
<div class="thanks" id="foot"></div>
</div>
<script>
// The server swaps the sample between the two markers. Designers: keep the markers and the field names.
const VOUCHER = /*DATA*/{"voucher_no":"VS-SAMPLE","date":"24 Nov 2026","shop":{"name":"Royal Bath Hub","address":"No. 173/1, Kandy Road, Thihariya, Kalagedihena, Sri Lanka","phone":"+94 74 035 5536","email":"royalbathhub1@gmail.com"},"vendor":{"name":"Sample Vendor","phone":""},"bills":[{"bill_no":"B1","bill_date":"2026-10-09","total":1000,"returns":[],"returns_total":0,"net_payable":1000,"cheques":[],"cash":[],"paid":0,"balance":1000}],"returns":[],"returns_total":0,"cheques_total":0,"balance":1000}/*END*/;
const $=id=>document.getElementById(id),esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=n=>Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const day=d=>{const x=new Date(String(d).slice(0,10)+'T00:00:00');return isNaN(x)?esc(d||''):String(x.getDate()).padStart(2,'0')+'/'+String(x.getMonth()+1).padStart(2,'0')+'/'+x.getFullYear()};
const V=VOUCHER;
if(V.logo)$('logo').src=V.logo;else $('logo').style.display='none';
if(V.hdr){document.documentElement.style.setProperty('--hdr',V.hdr);document.documentElement.style.setProperty('--hdr-rgb',V.hdrRgb)}
if(V.bg)$('bg').style.backgroundImage='url("'+V.bg+'")';
$('vno').textContent=V.voucher_no;$('shop').textContent=V.shop.name;
$('addr').innerHTML=esc(V.shop.address)+'<br>'+esc(V.shop.phone)+(V.shop.email?'  |  '+esc(V.shop.email):'');
$('vendor').textContent=V.vendor.name;$('date').textContent='Date: '+day(new Date(Date.now()+19800000).toISOString());
const C=x=>Math.round(Number(x||0)*100),M=c=>money(c/100),today=new Date(Date.now()+19800000).toISOString().slice(0,10);
const ev=[];
V.bills.forEach(b=>{
  ev.push({d:String(b.bill_date).slice(0,10),o:0,ref:'Invoice '+esc(b.bill_no)+(b.grn_no&&b.grn_no!==b.bill_no?' (GRN '+esc(b.grn_no)+')':''),dr:C(b.total),cr:0});
  (b.returns||[]).forEach(r=>ev.push({d:String(r.date).slice(0,10),o:1,ref:'Goods returned: '+(r.qty!==''?esc(r.qty)+' × ':'')+esc(r.item),sub:r.rate?'Return note, '+esc(r.qty)+' × '+money(r.rate).replace('.00','')+'. Credit note requested.':'Credit note requested.',dr:0,cr:C(r.amount)}));
  (b.cheques||[]).forEach(c=>ev.push({d:String(c.date).slice(0,10),o:2,ref:'Cheque No. '+esc(c.no)+(c.bank?' ('+esc(c.bank)+')':''),sub:String(c.date).slice(0,10)>today?'Post-dated, on credit until it clears':'',pd:String(c.date).slice(0,10)>today,dr:0,cr:C(c.amount)}));
  (b.cash||[]).forEach(c=>ev.push({d:String(c.date).slice(0,10),o:2,ref:'Payment ('+esc(c.method)+')',dr:0,cr:C(c.amount)}));
});
ev.sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:a.o-b.o);
let bal=0,tdr=0,tcr=0;
$('led').innerHTML=ev.map(e=>{bal+=e.dr-e.cr;tdr+=e.dr;tcr+=e.cr;return '<tr><td>'+day(e.d)+'</td><td><b>'+e.ref+'</b>'+(e.sub?'<small>'+e.sub+'</small>':'')+'</td><td class="n">'+(e.dr?M(e.dr):'')+'</td><td class="n'+(e.pd?' pd':'')+'">'+(e.cr?M(e.cr):'')+'</td><td class="n"><b>'+M(bal)+'</b></td></tr>'}).join('');
$('tdr').textContent=M(tdr);$('tcr').textContent=M(tcr);$('tbl').textContent=M(bal);
const retC=C(V.returns_total),chqC=V.bills.reduce((t,b)=>t+(b.cheques||[]).reduce((u,c)=>u+C(c.amount),0),0),cashC=V.bills.reduce((t,b)=>t+(b.cash||[]).reduce((u,c)=>u+C(c.amount),0),0);
const srow=(l,r,cls)=>'<div class="sr '+(cls||'')+'"><span>'+l+'</span><b>'+r+'</b></div>';
let sm=srow('Total billed (invoices)','Rs. '+M(tdr));
if(retC)sm+=srow('Less: goods returned','(Rs. '+M(retC)+')');
if(chqC)sm+=srow('Less: cheques given (post-dated, on credit until they clear)','(Rs. '+M(chqC)+')');
if(cashC)sm+=srow('Less: payments made','(Rs. '+M(cashC)+')');
if(V.bills.length>1)V.bills.forEach(b=>{sm+=srow('Balance on invoice '+esc(b.bill_no),'Rs. '+money(b.balance),'tot')});
$('sumry').innerHTML=sm;
$('duel').textContent='TOTAL DUE TO '+String(V.vendor.name).toUpperCase();$('dueb').textContent='Rs '+money(V.balance);
const rt=V.returns_total>0;
$('note').innerHTML=(rt?'Please issue a credit note for the returned goods, Rs '+money(V.returns_total).replace('.00','')+'.<br>':'')+(V.cheques_total>0?'Cheques are post-dated as shown above (on credit until they clear).':'');
$('foot').textContent='අප හා සම්බන්ධ වුවාට ස්තූතියි! / Thank you';
</script></body></html>
