<script src="/grn_match.js"></script>
<script>
(function(){
var CLOUD=location.protocol!=='file:';if(/[?&]embed=1/.test(location.search))document.body.classList.add('embed');
var drafts=[],cur=null,vendors=[],openBills=[],vorder=[],vinfo={};
function $(i){return document.getElementById(i)}
function fmt0(n){return Math.round(Number(n)||0).toLocaleString('en-LK')}
function fmt(n){return Number(n||0).toLocaleString('en-LK',{minimumFractionDigits:2,maximumFractionDigits:2})}
function h(tag,props,kids){var e=document.createElement(tag);for(var k in (props||{})){if(k==='text')e.textContent=props[k];else if(k==='class')e.className=props[k];else if(k.slice(0,2)==='on')e[k]=props[k];else e.setAttribute(k,props[k])}(kids||[]).forEach(function(c){e.appendChild(c)});return e}
function today(){return new Date().toISOString().slice(0,10)}
function addDays(d,n){var x=new Date(d+'T00:00:00Z');x.setUTCDate(x.getUTCDate()+Number(n||0));return x.toISOString().slice(0,10)}
var seq=0;
function blank(kind){return{id:'D'+(++seq)+'-'+Date.now(),kind:kind,vendor:'',no:'',date:today(),received:today(),credit_days:90,ptype:'BILL',lines:kind==='GRN'?[newLine()]:[],paper:0,amount:0,photo:'',status:'draft',note:'',dup:null,ch:{cheque_no:'',bank:'',amount:0,cheque_date:today(),due_date:today(),bill_id:'',same_bank:false}}}
function fromBill(b){var d=blank('GRN');d.id=b.id;d.vendor=b.vendor;d.no=/^\s*[\(\[].*[\)\]]\s*$/.test(String(b.no||''))?'':b.no;d.date=b.date;d.received=b.received||b.date;d.credit_days=b.credit_days==null?90:b.credit_days;d.paper=b.printed_total;d.note=b.note||'';d.photoUrl=b.photo||'';d.lines=b.lines.map(function(l){return{code:l.code||'',name:l.name,qty:l.qty,unit:l.unit,sell:l.sell||0}});return d}
function newLine(){return{code:'',name:'',qty:1,unit:0,sell:0,short:0,ret:0,dmg:0,arrived:true}}
/* Received quantity: paper qty minus short, returned and damaged; 0 if the line has not arrived. Stock and the GRN total follow THIS. The paper total stays for reference. */
function nq(l){return l.arrived===false?0:Math.max(0,(Number(l.qty)||0)-(Number(l.short)||0)-(Number(l.ret)||0)-(Number(l.dmg)||0))}
function isPart(l){return l.arrived===false||(Number(l.short)||0)>0||(Number(l.ret)||0)>0||(Number(l.dmg)||0)>0}
function hasPart(d){return d.kind==='GRN'&&d.lines.some(function(l){return(l.name||l.unit)&&isPart(l)})}
function fullTotal(d){return d.lines.reduce(function(s,l){return s+l.qty*net(l)},0)}
function net(l){var x=Number(l.disc)||0;return x>0?Math.round(l.unit*(1-x/100)*100)/100:l.unit}
function total(d){return d.kind==='GRN'?d.lines.reduce(function(s,l){return s+nq(l)*net(l)},0):d.kind==='BILL'?Number(d.amount)||0:Number(d.ch.amount)||0}
function title(d){var k=d.kind==='GRN'?'GRN':d.kind==='BILL'?'Bill':'Cheque';return k+': '+(d.vendor||'(no vendor)')+' '+(d.no||d.ch.cheque_no||'')}
function isEmpty(d){return !d.vendor&&!d.no&&!d.photo&&!d.ch.cheque_no&&!d.amount&&d.lines.every(function(l){return !l.name&&!l.unit})}
function save(){try{localStorage.setItem('grn_drafts_v3',JSON.stringify(drafts.map(function(d){var c=JSON.parse(JSON.stringify(Object.assign({},d,{photo:''})));return c})))}catch(e){}}
function load(){try{return JSON.parse(localStorage.getItem('grn_drafts_v3')||'[]')}catch(e){return[]}}

function modal(t,body){yesFn=null;$('mn').style.display='none';$('mx').textContent='OK, close';$('mt').textContent=t;var mb=$('mb');mb.textContent='';(Array.isArray(body)?body:[body]).forEach(function(x){mb.appendChild(h('p',{text:x}))});$('modal').classList.add('on')}
var yesFn=null;
$('mx').onclick=function(){$('modal').classList.remove('on');var f=yesFn;yesFn=null;$('mn').style.display='none';$('mx').textContent='OK, close';if(f)f()};
$('mn').onclick=function(){yesFn=null;$('modal').classList.remove('on');$('mn').style.display='none';$('mx').textContent='OK, close'};
function ask(t,lines,yes,fn){modal(t,lines);yesFn=fn;$('mx').textContent=yes;$('mn').style.display='inline-block'}
/* ---------- photos kept in the browser so they survive a reload ---------- */
var idb=null;
function idbOpen(){return new Promise(function(res){if(idb||!window.indexedDB)return res(idb);try{var q=indexedDB.open('rbh_grn',1);q.onupgradeneeded=function(){q.result.createObjectStore('p')};q.onsuccess=function(){idb=q.result;res(idb)};q.onerror=function(){res(null)}}catch(e){res(null)}})}
function idbPut(id,v){return idbOpen().then(function(db){if(!db)return;try{db.transaction('p','readwrite').objectStore('p').put(v,id)}catch(e){}})}
function idbDel(id){return idbOpen().then(function(db){if(!db)return;try{db.transaction('p','readwrite').objectStore('p').delete(id)}catch(e){}})}
function idbGet(id){return idbOpen().then(function(db){return new Promise(function(res){if(!db)return res('');try{var q=db.transaction('p').objectStore('p').get(id);q.onsuccess=function(){res(q.result||'')};q.onerror=function(){res('')}}catch(e){res('')}})})}

function api(path,opt){return fetch('/api/grn-workbench'+path,Object.assign({credentials:'same-origin'},opt||{})).then(function(r){return r.text().then(function(t){var j;try{j=JSON.parse(t)}catch(e){j={error:r.status===429?'Too many requests right now. Wait about a minute and try again.':'The app sent an unexpected reply ('+r.status+').'}}return{s:r.status,j:j}})})}
function useNumber(d,n){d.no=n;d.dup=null;if(d.status==='dup')d.status='draft';render();checkDup(d,true)}
function stOf(d){var r=d.status==='saved'?['SAVED','t-saved']:d.status==='editing'?['SAVED (you can keep editing)','t-new']:d.status==='dup'?['ALREADY IN APP','t-dup']:d.status==='cancelled'?['CANCELLED','t-dup']:['NEW','t-new'];if(hasPart(d)&&d.status!=='cancelled'&&d.status!=='dup')r=[r[0]+' | PART RECEIVED','t-new'];return r}
/* Number check: this vendor + this number, looked up in saved bills and GRN records (read only, nothing is changed). */
function checkDup(d,quiet){
 if(!CLOUD||d.kind==='CHEQUE'||d.status==='saved'||d.billId||(!d.no&&!d.vendor))return Promise.resolve();
 return api('/check?bill_no='+encodeURIComponent(d.no||'')+'&vendor='+encodeURIComponent(d.vendor||'')).then(function(x){
  var j=x.j||{};d.nextFree=j.next_free||'';
  if(j.exists){d.dup=j.bill;d.status='dup';
   if(!quiet){var b=j.bill,L=['GRN '+b.bill_no+' already exists for '+b.vendor_name+' ('+String(b.bill_date||'').slice(0,10)+', Rs '+fmt(b.total)+').','It will not be saved a second time.'];
    if(j.next_free)ask('Number already used',L,'Use '+j.next_free,function(){useNumber(d,j.next_free)});else modal('Number already used',L)}}
  else{d.dup=null;if(d.status==='dup')d.status='draft';if(j.other_vendor&&!quiet)modal('Same number, different vendor',['Number '+d.no+' exists for '+j.other_vendor.vendor_name+'. Check the number on the paper is right.'])}
  /* repaint only the parts that change: a full redraw here would steal the cursor while typing */
  drawDrafts();if(d===cur){drawDup();sums()}}).catch(function(){})}
function drawDup(){
 var d=cur,B=$('dupbox'),T=$('sttag');if(T){var st=stOf(d);T.textContent=st[0];T.className='tag '+st[1]}
 if(!B)return;B.textContent='';
 if(d.dup){var g=d.dup;
  B.appendChild(h('div',{class:'msg bad app-pop',text:'GRN '+g.bill_no+' already exists for '+(g.vendor_name||d.vendor)+' ('+String(g.bill_date||'').slice(0,10)+', Rs '+fmt(g.total)+'). Saving is blocked so nothing is doubled.'}));
  var bt=[];if(g.id)bt.push(h('button',{class:'p',text:'Open it',onclick:function(){openSaved(g.id)}}));
  if(d.nextFree)bt.push(h('button',{text:'Use next free number: '+d.nextFree,onclick:function(){useNumber(d,d.nextFree)}}));
  if(bt.length)B.appendChild(h('div',{class:'row'},bt))}
 else if(!d.no&&d.nextFree&&d.vendor&&d.kind==='GRN'){
  B.appendChild(h('div',{class:'msg numfix',text:'No number typed yet. The next free number for '+d.vendor+' is '+d.nextFree+'.'},[h('div',{class:'row'},[h('button',{class:'p',text:'Use '+d.nextFree,onclick:function(){useNumber(d,d.nextFree)}})])]))}}

/* ---------- photo ---------- */
function loadPhoto(file){
 var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){
  var m=2200,s=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);
  cur.photo=c.toDataURL('image/jpeg',0.88);idbPut(cur.id,cur.photo);drawFrame();gm('Photo added. Press Generate to read it, or type it yourself.','')};im.src=r.result};r.readAsDataURL(file)}
function rotate(dir){if(!cur.photo)return;var im=new Image();im.onload=function(){var c=document.createElement('canvas');c.width=im.height;c.height=im.width;var x=c.getContext('2d');x.translate(c.width/2,c.height/2);x.rotate(dir*Math.PI/2);x.drawImage(im,-im.width/2,-im.height/2);cur.photo=c.toDataURL('image/jpeg',0.88);idbPut(cur.id,cur.photo);drawFrame()};im.src=cur.photo}
function drawFrame(){var f=$('frame');f.textContent='';f.classList.toggle('has',!!(cur.photo||cur.photoUrl));if(cur.photo||cur.photoUrl){f.appendChild(h('img',{src:cur.photo||cur.photoUrl,alt:'bill'}))}else f.appendChild(h('span',{text:'Choose the bill photo below',style:'color:#4d5c53'}))}
function gm(t,cls,retry){var m=$('genmsg');m.style.display=t?'block':'none';m.textContent=t;m.className='msg '+(cls||'');if(t&&cls==='busy')m.appendChild(h('div',{class:'bar'}));if(t&&retry)m.appendChild(h('div',{class:'row'},[h('button',{class:'p',text:'Retry',onclick:retry})]))}
$('photo').onchange=function(e){if(e.target.files[0])loadPhoto(e.target.files[0]);e.target.value=''};
$('rotL').onclick=function(){rotate(-1)};$('rotR').onclick=function(){rotate(1)};
$('zoom').onclick=function(){var z=$('frame').classList.toggle('zoom');$('zoom').textContent=z?'Fit to frame':'Zoom in'};
var GEN_TXT='Generate: read the photo and fill the right side',genT=null;
function genStop(){if(genT){clearInterval(genT);genT=null}$('gen').disabled=false;$('gen').textContent=GEN_TXT}
/* Everything the reader finds goes into THE DRAFT THAT WAS ON SCREEN WHEN YOU PRESSED GENERATE (not whichever is open when the answer comes back). */
function applyRead(d,o){
 var got=[],miss=[];
 if(o.kind==='cheque'){d.kind='CHEQUE';d.vendor=o.vendor||d.vendor;d.ch.cheque_no=o.cheque_no||'';d.ch.bank=o.bank||'';d.ch.amount=o.amount||0;if(o.cheque_date){d.ch.cheque_date=o.cheque_date;d.ch.due_date=o.cheque_date}d.lines=[];return{cheque:true}}
 if(d.kind==='CHEQUE')d.kind='GRN';
 if(!d.lines.length&&d.kind==='GRN')d.lines=[newLine()];
 if(o.vendor){d.vendor=o.vendor;got.push('vendor')}else miss.push('vendor');
 if(o.bill_no){d.no=o.bill_no;got.push('bill number')}else miss.push('bill number');
 if(o.bill_date){d.date=o.bill_date;d.received=o.bill_date;got.push('dates')}else miss.push('bill date');
 var usual=vinfo[String(d.vendor||'').toLowerCase()];
 if(o.credit_days!=null){d.credit_days=o.credit_days;got.push('credit days')}else if(usual!=null){d.credit_days=usual;got.push('credit days (vendor usual)')}else miss.push('credit days');
 if(o.total){d.paper=o.total;got.push('paper total')}else miss.push('paper total');
 if(d.kind==='GRN'){if(o.lines&&o.lines.length){d.lines=o.lines.map(function(l){l.sell=0;return l});got.push(o.lines.length+' lines');if(window.GrnMatch)GrnMatch.run(d,render)}else miss.push('lines')}
 else if(o.total){d.amount=o.total}
 d.dup=null;if(d.status==='dup')d.status='draft';
 return{got:got,miss:miss}}
function runGenerate(d){
 d=d||cur;
 if(!d.photo){gm('Choose a photo first.','warn');return}
 if(!CLOUD){gm('Opened as a file. Reading needs the app. Open it from the shop app.','warn');return}
 if(d.status==='saved'){gm('This bill is already saved, so nothing was changed. Press "Edit this bill" first, or start + New GRN.','warn');return}
 if(genT)return;
 if(d.status==='cancelled'){d.status='draft';d.billId=null;d.note=''}
 var t0=Date.now();$('gen').disabled=true;$('gen').textContent='Reading the photo...';
 function tick(){gm('Step 1 of 2: reading the photo ('+Math.round((Date.now()-t0)/1000)+'s). The free reader can take up to a minute. Please wait.','busy')}
 tick();genT=setInterval(tick,1000);
 var again=function(){if(cur!==d&&drafts.indexOf(d)>=0){cur=d;render()}runGenerate(d)};
 api('/read',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({photo_data_url:d.photo})}).then(function(x){
  genStop();var o=x.j||{};
  if(x.s===429)o={ok:false,retry:true,message:'Too many requests right now. Wait about a minute, then press Retry. Nothing was lost.'};
  if(drafts.indexOf(d)<0){gm('That draft was deleted while it was being read. Nothing was filled.','warn');return}
  if(!o.ok){gm(o.message||o.error||'Could not read it. Press Retry, or type it using the photo.','bad',o.retry===false?null:again);return}
  if(o.kind==='sale_bill'){gm('This looks like a SELLING bill (Royal Bath Hub is the seller), not a vendor bill. It was not filled in.','bad');return}
  if(o.kind!=='vendor_bill'&&o.kind!=='cheque'){gm('Could not tell what this paper is. Type it using the photo, or press Retry.','warn',again);return}
  var r=applyRead(d,o);
  if(d===cur){render()}else{drawDrafts();save()}
  if(r.cheque){gm('Read as a CHEQUE. Check it against the photo, then pick which bill it pays.','ok');if(d===cur)loadOpen();return}
  var lt=d.kind==='GRN'?total(d):0,cmp=d.paper>0&&d.kind==='GRN'?(Math.abs(lt-d.paper)<0.5?' Lines add up to the paper total.':' Lines total '+fmt(lt)+' but paper total is '+fmt(d.paper)+': check the lines.'):'';
  var where=d===cur?'':' (filled in the draft "'+title(d)+'", it is not the one open now)';
  gm('Done'+where+'. Filled: '+r.got.join(', ')+'.'+(r.miss.length?' Not found on the photo, please type: '+r.miss.join(', ')+'.':'')+cmp+' Vendor '+(o.vendor_known?'is known':'is new')+'. Confidence: '+(o.confidence||'?')+'. CHECK every line against the photo. '+(o.notes||''),(o.confidence==='high'&&!r.miss.length)?'ok':'warn');
  if(d===cur){checkDup(d,false);if(window.innerWidth<960)$('right').scrollIntoView({behavior:'smooth',block:'start'})}else checkDup(d,true)
 }).catch(function(e){genStop();gm('Could not reach the app ('+e.message+'). Check the connection, then press Retry.','bad',again)})}
$('gen').onclick=function(){runGenerate(cur)};

/* ---------- drafts list ---------- */
function vrank(d){var n=String(d.vendor||'').toLowerCase().split(' ')[0];for(var i=0;i<vorder.length;i++){if(String(vorder[i]).toLowerCase().split(' ')[0]===n)return i}return 99}
function drawDrafts(){var L=$('drafts');L.textContent='';
 drafts.slice().sort(function(a,b){return vrank(a)-vrank(b)}).forEach(function(d){
  var st=d.status==='saved'?['SAVED','t-saved']:d.status==='editing'?['SAVED, editable','t-saved']:d.status==='dup'?['ALREADY IN APP','t-dup']:['draft','t-draft'];
  var pr=hasPart(d)?h('span',{class:'tag t-new',text:'PART RECEIVED'}):document.createTextNode('');
  var row=h('div',{class:'dr'+(d===cur?' on':'')},[h('span',{class:'t',onclick:function(){open(d)}},[h('span',{text:title(d)}),h('span',{class:'s',text:(d.paper?'Paper total '+fmt(d.paper):'')+(d.photo?'  |  photo added':'')})]),h('span',{class:'tag '+st[1],text:st[0]}),pr,h('span',{class:'gap'}),h('button',{class:'d',text:'Delete draft',style:'min-height:32px;padding:2px 10px',onclick:function(){del(d)}})]);
  L.appendChild(row)});
 if(!drafts.length)L.appendChild(h('div',{class:'msg',text:'No drafts. Press + New GRN.'}))}
function del(d){var i=drafts.indexOf(d);if(i<0)return;idbDel(d.id);if(CLOUD&&d.id&&d.status!=='saved'){fetch('/api/grn-workbench/dismiss',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:d.id})}).catch(function(){})}drafts.splice(i,1);if(!drafts.length)drafts.push(blank('GRN'));if(cur===d)cur=drafts[Math.max(0,i-1)];save();render()}
$('clearEmpty').onclick=function(){drafts=drafts.filter(function(d){return !isEmpty(d)||d===cur});if(!drafts.length)drafts.push(blank('GRN'));if(drafts.indexOf(cur)<0)cur=drafts[0];save();render()};
function open(d){cur=d;gm('','');render();checkDup(d,true);if(!d.photo)idbGet(d.id).then(function(p){if(p&&cur===d){d.photo=p;drawFrame()}})}
document.querySelectorAll('[data-new]').forEach(function(b){b.onclick=function(){var d=blank(b.getAttribute('data-new'));drafts.push(d);cur=d;gm('','');render();focusFirst()}});

/* ---------- right side ---------- */
function field(label,input){return h('div',{style:'display:flex;flex-direction:column;gap:2px;min-width:140px;flex:1'},[h('label',{text:label,style:'font-weight:600;color:#4d5c53;font-size:14px'}),input])}
function inp(v,type,fn,extra){var i=h('input',Object.assign({type:type||'text',enterkeyhint:'next'},type==='number'?{step:'any',inputmode:'decimal'}:{},extra||{}));i.value=v==null?'':v;i.onchange=function(){fn(i.value)};return i}
function loadOpen(){openBills=[];if(!CLOUD||!cur.vendor){drawRight();return}api('/open-bills?vendor='+encodeURIComponent(cur.vendor)).then(function(x){openBills=Array.isArray(x.j)?x.j:[];drawRight()}).catch(function(){})}
function drawRight(){
 var R=$('right');R.textContent='';var d=cur;
 var st=stOf(d);
 R.appendChild(h('div',{class:'row'},[h('h3',{text:'2. '+(d.kind==='GRN'?'GRN (goods received: adds stock + bill)':d.kind==='BILL'?'Bill (money only, no stock)':'Cheque (pays a vendor bill)'),style:'margin:0;flex:1'}),h('span',{id:'sttag',class:'tag '+st[1],text:st[0]})]));
 if(d.status==='editing')R.appendChild(h('div',{class:'msg warn',text:'You are editing a bill that is already saved. Stock and totals are corrected when you press Save changes.'}));
 var vi=inp(d.vendor,'text',function(v){d.vendor=v.trim();var dc=vinfo[d.vendor.toLowerCase()];if(dc!=null&&d.status!=='saved'&&d.kind!=='CHEQUE'){d.credit_days=dc;var ci=$('cd');if(ci)ci.value=dc}
  /* no full redraw here: it would swallow the tap that moves you to the next box */
  if(d.kind==='CHEQUE'){render();loadOpen()}else{drawDrafts();save();sums();checkDup(d,false)}},{list:'vlist',placeholder:'Vendor name'});
 if(d.kind==='CHEQUE'){
