<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Salary &amp; commission | Royal Bath Hub</title>
<link rel="stylesheet" href="/rbh-font.css"><script src="/bathhub-theme.js"></script>
<style>
:root{--bg:#f8f9fa;--card:#fff;--line:#dbe0e8;--ink:#0f172a;--muted:#596577;--gold:#8f670a;--red:#b3261e;--green:#1b7a46}
html[data-theme=dark]{--bg:#0b0d10;--card:#14171d;--line:#282f3a;--ink:#f8fafc;--muted:#94a3b8;--gold:#d4af37}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,"Segoe UI",sans-serif;padding:12px}
h1{font-size:19px;margin:0 0 4px}.sm{color:var(--muted);font-size:13px}.k{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin:10px 0}
.k div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px}.k b{display:block;font-size:20px;margin:2px 0}.k span{font-size:12px;color:var(--muted)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin:10px 0}.bar label{display:block;font-size:12px;color:var(--muted)}.bar input,.bar button{font:inherit;min-height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:4px 10px}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:8px 0}th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}th{font-size:12px;color:var(--muted)}.n{text-align:right;white-space:nowrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:8px 0}button.on{background:var(--gold);color:#fff;border-color:var(--gold)}tr.pick{cursor:pointer}tr.pick:hover,tr.sel{background:rgba(143,103,10,.12)}summary{cursor:pointer;min-height:32px}a{color:var(--gold)}.err{color:var(--red)}

.pill{display:inline-block;border-radius:999px;padding:1px 8px;font-size:12px;background:rgba(143,103,10,.15)}.gold{background:var(--gold);color:#fff;border-color:var(--gold)}td.d{white-space:nowrap}tr.dayhead td{background:rgba(143,103,10,.08);font-weight:600}
</style></head><body>
<h1>Salary &amp; commission</h1>
<div class="sm" id="sub">Loading...</div>
<div id="out"></div>
<script>
(function(){'use strict';
var $=function(i){return document.getElementById(i)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var rs=function(n){return 'Rs '+Number(n||0).toLocaleString('en-LK',{minimumFractionDigits:2,maximumFractionDigits:2})};
var dmy=function(d){return String(d).split('-').reverse().join('-')};
var ymd=function(d){return d.toISOString().slice(0,10)};
var today=function(){return ymd(new Date(Date.now()+19800000))};
var back=function(n){return ymd(new Date(Date.now()+19800000-n*864e5))};
var STAFF=null,D=null,MODE='day',F='',T='';
function api(u,o){o=o||{};o.credentials='same-origin';return fetch(u,o).then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.error||'Could not load');return j})})}
function init(){
 api('/api/sales-commission').then(function(d){STAFF=(d.ledger_staff||[])[0];if(!STAFF){$('sub').textContent='No salaried staff is set up yet.';return}load()}).catch(function(e){$('sub').innerHTML='<span class="err">'+esc(e.message.indexOf('Owner')>=0?'Please sign in as owner':e.message)+'</span>'})}
function load(){api('/api/staff-statement/'+STAFF.id).then(function(d){D=d;if(!F)F=back(6);if(!T)T=today();draw()}).catch(function(e){$('sub').innerHTML='<span class="err">'+esc(e.message)+'</span>'})}
// rows of the chosen range with a running opening balance worked out from the full history
function view(){var open=D.opening||0,days=[];D.days.forEach(function(o){
  var ded=o.deductions.reduce(function(t,x){return t+x.amount},0),net=o.salary+o.commission+o.adjust-ded;
  if(o.date<F){open=o.closing;return}if(o.date>T)return;days.push(o)});
 return {open:open,days:days}}
function draw(){
 var V=view(),nm=D.staff.name,tot={s:0,c:0,d:0};V.days.forEach(function(o){tot.s+=o.salary;tot.c+=o.commission;tot.d+=o.deductions.reduce(function(t,x){return t+x.amount},0)});
 $('sub').textContent='';
 var h='<div class="k"><div><span>Owed to '+esc(nm)+' now (salary + commission, less paid / taken)</span><b>'+rs(D.totals.net_payable)+'</b></div></div>';
 h+='<div class="bar"><button type="button" data-n="0">1 day</button><button type="button" data-n="1">2 days</button><button type="button" data-n="6">1 week</button><button type="button" data-n="all">All</button><div><label>From</label><input type="date" id="f" value="'+esc(F)+'"></div><div><label>To</label><input type="date" id="t" value="'+esc(T)+'"></div><button id="go" type="button">Show</button><button id="pdf" type="button" class="gold">Download PDF</button></div>';
 h+='<div class="bar"><button type="button" data-m="day"'+(MODE==='day'?' class="on"':'')+'>By day</button><button type="button" data-m="inv"'+(MODE==='inv'?' class="on"':'')+'>By invoice</button></div>';
 h+='<div class="k"><div><span>Brought forward</span><b>'+rs(V.open)+'</b></div><div><span>Salary</span><b>'+rs(tot.s)+'</b></div><div><span>Commission</span><b>'+rs(tot.c)+'</b></div><div><span>Paid / taken</span><b>'+rs(tot.d)+'</b></div></div>';
 if(MODE==='day'){
  h+='<table><thead><tr><th>Day</th><th class="n">Salary</th><th class="n">Commission</th><th class="n">Paid / taken</th><th class="n">Balance</th></tr></thead><tbody>'+(V.days.length?V.days.slice().reverse().map(function(o){var ded=o.deductions.reduce(function(t,x){return t+x.amount},0);
   return '<tr><td class="d">'+esc(dmy(o.date))+(o.invoices.length?' <span class="pill">'+o.invoices.length+' invoice'+(o.invoices.length>1?'s':'')+'</span>':'')+'</td><td class="n">'+(o.salary?rs(o.salary):'')+'</td><td class="n">'+(o.commission?rs(o.commission):'')+'</td><td class="n">'+(ded?rs(ded):'')+'</td><td class="n"><b>'+rs(o.closing)+'</b></td></tr>'}).join(''):'<tr><td colspan="5" class="sm">Nothing in this range.</td></tr>')+'</tbody></table>';
 } else {
  h+='<table><thead><tr><th>Day</th><th>What</th><th class="n">Earned</th><th class="n">Paid / taken</th><th class="n">Balance</th></tr></thead><tbody>';
  if(!V.days.length)h+='<tr><td colspan="5" class="sm">Nothing in this range.</td></tr>';
  V.days.slice().reverse().forEach(function(o){var L=[];
   o.deductions.slice().reverse().forEach(function(x){L.push(['<a href="#" data-void="'+x.id+'" title="Undo">'+esc(x.what)+(x.note?' ('+esc(x.note)+')':'')+'</a>',null,x.amount])});
   o.invoices.slice().reverse().forEach(function(i){L.push(['Commission, invoice '+esc(i.bill),i.commission,null])});
   if(o.adjust)L.push(['Adjustment',o.adjust>0?o.adjust:null,o.adjust<0?-o.adjust:null]);
   if(o.salary)L.push(['Daily salary',o.salary,null]);
   L.forEach(function(l,i){h+='<tr><td class="d">'+(i===0?esc(dmy(o.date)):'')+'</td><td>'+l[0]+'</td><td class="n">'+(l[1]!=null?rs(l[1]):'')+'</td><td class="n">'+(l[2]!=null?rs(l[2]):'')+'</td><td class="n">'+(i===0?'<b>'+rs(o.closing)+'</b>':'')+'</td></tr>'})});
  h+='</tbody></table><div class="sm">Tap a Paid / Taken line to undo it (nothing is deleted).</div>';
 }
 h+='<div class="card"><b>Record money</b><div class="sm">Every day tell me what '+esc(nm)+' took, or what you paid him. Both come off what he is owed.</div><div class="bar"><div><label>Date</label><input type="date" id="ed" value="'+esc(today())+'"></div><div><label>Amount (Rs)</label><input type="number" id="ea" min="1" step="any" inputmode="decimal" style="width:130px"></div><div><label>Note</label><input type="text" id="en" placeholder="optional"></div><button type="button" id="took" class="gold">He took</button><button type="button" id="paid" class="gold">I paid</button></div><div id="em" class="sm"></div></div>';
 $('out').innerHTML=h;
 Array.prototype.forEach.call($('out').querySelectorAll('button[data-m]'),function(b){b.onclick=function(){MODE=b.dataset.m;draw()}});
 Array.prototype.forEach.call($('out').querySelectorAll('button[data-n]'),function(b){b.onclick=function(){if(b.dataset.n==='all'){F='2000-01-01'}else F=back(+b.dataset.n);T=today();draw()}});
 $('go').onclick=function(){F=$('f').value||F;T=$('t').value||T;draw()};
 $('pdf').onclick=function(){var f=F==='2000-01-01'?'':F;window.open('/api/staff-statement/'+STAFF.id+'/pdf?from='+encodeURIComponent(f)+'&to='+encodeURIComponent(T),'_blank')};
 function rec(kind){var a=Number($('ea').value),day=$('ed').value;if(!(a>0)){$('em').textContent='Type the amount.';return}
  var word=kind==='took'?'TOOK':'was PAID';if(!confirm(nm+' '+word+' '+rs(a)+' on '+dmy(day)+'. Save it?'))return;
  var note=($('en').value||'').trim();if(kind==='took')note='Took: '+note;
  api('/api/staff-ledger/'+STAFF.id,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({date:day,kind:'paid',amount:a,note:note})}).then(load).catch(function(e){$('em').innerHTML='<span class="err">'+esc(e.message)+'</span>'})}
 $('took').onclick=function(){rec('took')};$('paid').onclick=function(){rec('paid')};
 Array.prototype.forEach.call($('out').querySelectorAll('a[data-void]'),function(a){a.onclick=function(e){e.preventDefault();var why=prompt('Why undo this? (it is marked cancelled, not deleted)');if(!why||why.trim().length<3)return;api('/api/staff-ledger/entry/'+a.dataset.void+'/void',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({reason:why})}).then(load)}});
}
init();
})();
</script></body></html>
