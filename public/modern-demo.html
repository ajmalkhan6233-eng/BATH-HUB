<!DOCTYPE html><html data-theme="dark" data-tone="soft"><head><link rel="stylesheet" href="/rbh-font.css"><script src="/rbh-early.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RBH new look preview</title><style>/* ==========================================================================
   ROYAL BATH HUB DESIGN LAYER  (public/bathhub-design.css)
   Visual design only: colours, type, spacing, themes. No logic, no network.
   Themes: Gold (default dark), Water, Light  ->  <html data-theme="dark|water|light">
   Rules: every button/tab/toggle/nav item is at least 48 x 48 px; body text >= 14 px, labels >= 12 px; icons are inline SVG (no emoji).
   Link this file LAST in <head> so it wins over a page's own <style>.
   ========================================================================== */

@import url("/design2_tokens.css");   /* Design 2 look in the shop colours (black, ash, gold); remove this line to go back to Design 3 */

/* ---- 1. TOKENS (from the Royal Bath Hub design system) ---- */
:root, [data-theme="dark"], [data-theme="gold"] {
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:20px; --space-6:24px; --space-8:32px; --space-12:48px;
  --font-sans: 'Inter', system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Sinhala", "Noto Sans Tamil", sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --text-xs:12px; --text-sm:14px; --text-base:15px; --text-md:16px; --text-lg:18px; --text-xl:20px; --text-2xl:24px; --text-3xl:30px;
  --radius-xs:4px; --radius-sm:8px; --radius-md:12px; --radius-lg:16px; --radius-xl:24px; --radius-full:9999px;
  --touch-target:48px;
  --shadow-sm:0 1px 2px 0 rgba(0,0,0,.25); --shadow-md:0 4px 12px 0 rgba(0,0,0,.35); --shadow-lg:0 10px 28px 0 rgba(0,0,0,.45); --shadow-gold:0 4px 16px 0 rgba(212,175,55,.2);

  --bg-canvas:#0b0d10; --bg-surface:#14171d; --bg-surface-elevated:#1d2129; --bg-surface-subtle:#181b22; --bg-surface-hover:#262c37; --bg-input:#101216;
  --bg-glass:rgba(20,23,29,.88); --bg-glass-fallback:#14171df5;
  --border-subtle:#282f3a; --border-strong:#3b4554; --border-focus:#d4af37;
  --text-primary:#f8fafc; --text-secondary:#cbd5e1; --text-muted:#94a3b8; --text-on-accent:#000000;
  --gold-primary:#d4af37; --gold-hover:#e5c158; --gold-active:#bf9b2f; --gold-text:#f0ce64; --gold-bg-subtle:rgba(212,175,55,.12); --gold-border-subtle:rgba(212,175,55,.32);
  --status-success:#34d399; --status-success-bg:rgba(52,211,153,.14);
  --status-danger:#f87171;  --status-danger-bg:rgba(248,113,113,.14);
  --status-warning:#fbbf24; --status-warning-bg:rgba(251,191,36,.14);
  --status-info:#38bdf8;    --status-info-bg:rgba(56,189,248,.14);
  --ceramic-white:#ffffff; --water-cyan:#38bdf8;
  color-scheme: dark;
}
[data-theme="light"] {
  --bg-canvas:#f8f9fa; --bg-surface:#ffffff; --bg-surface-elevated:#f1f3f7; --bg-surface-subtle:#f9fafb; --bg-surface-hover:#eaedf3; --bg-input:#ffffff;
  --bg-glass:rgba(255,255,255,.9); --bg-glass-fallback:#fffffff5;
  --border-subtle:#dbe0e8; --border-strong:#b2bcc9; --border-focus:#9e7415;
  --text-primary:#0f172a; --text-secondary:#334155; --text-muted:#596577; --text-on-accent:#ffffff;
  --gold-primary:#8f670a; --gold-hover:#755406; --gold-active:#5c4204; --gold-text:#785606; --gold-bg-subtle:rgba(143,103,10,.1); --gold-border-subtle:rgba(143,103,10,.28);
  --shadow-sm:0 1px 3px 0 rgba(0,0,0,.08); --shadow-md:0 4px 12px 0 rgba(0,0,0,.08); --shadow-lg:0 10px 24px 0 rgba(0,0,0,.1); --shadow-gold:0 4px 16px 0 rgba(143,103,10,.18);
  --status-success:#047857; --status-success-bg:rgba(4,120,87,.1);
  --status-danger:#dc2626;  --status-danger-bg:rgba(220,38,38,.1);
  --status-warning:#b45309; --status-warning-bg:rgba(180,83,9,.1);
  --status-info:#0369a1;    --status-info-bg:rgba(3,105,161,.1);
  color-scheme: light;
}
[data-theme="water"] {
  --bg-canvas:#060e15; --bg-surface:#0c1822; --bg-surface-elevated:#132331; --bg-surface-subtle:#0f1c27; --bg-surface-hover:#1b2f42; --bg-input:#081119;
  --bg-glass:rgba(12,24,34,.88); --bg-glass-fallback:#0c1822f0;
  --border-subtle:#1e364a; --border-strong:#2f5370; --border-focus:#06b6d4;
  --text-primary:#f0fdfa; --text-secondary:#99f6e4; --text-muted:#5eead4; --text-on-accent:#042f2e;
  --gold-primary:#06b6d4; --gold-hover:#22d3ee; --gold-active:#0891b2; --gold-text:#67e8f9; --gold-bg-subtle:rgba(6,182,212,.14); --gold-border-subtle:rgba(6,182,212,.35);
  --shadow-sm:0 1px 3px 0 rgba(0,0,0,.4); --shadow-md:0 4px 14px 0 rgba(4,30,45,.5); --shadow-lg:0 10px 30px 0 rgba(2,18,28,.6); --shadow-gold:0 4px 20px 0 rgba(6,182,212,.3);
  --water-cyan:#22d3ee;
  color-scheme: dark;
}

/* ---- 2. COMPATIBILITY: the colour names the existing pages already use now follow the design tokens ---- */
:root, [data-theme="dark"], [data-theme="gold"], [data-theme="light"], [data-theme="water"] {
  /* owner shell family */
  --gold:var(--gold-primary); --gold-dark:var(--gold-active); --gold-light:var(--gold-hover, #a07a12);
  --bg:var(--bg-canvas); --bg2:var(--bg-surface); --bg3:var(--bg-surface-elevated);
  --card:var(--bg-surface); --card-border:var(--border-subtle); --card-hover:var(--bg-surface-hover);
  --text:var(--text-primary); --text2:var(--text-secondary); --text3:var(--text-muted);
  --green:var(--status-success); --red:var(--status-danger); --amber:var(--status-warning); --blue:var(--status-info); --purple:#a78bfa;
  --radius:var(--radius-lg); --shadow:var(--shadow-md);
  /* screens that use accent / ink / line names */
  --accent:var(--gold-primary); --accent-ink:var(--text-on-accent); --ink:var(--text-primary); --txt:var(--text-primary);
  --bad:var(--status-danger); --ok:var(--status-success); --muted:var(--text-muted);
  --border:var(--border-subtle); --line:var(--border-subtle); --surface:var(--bg-surface);
  --note:var(--status-warning-bg); --note-ink:var(--status-warning);
  --wall:var(--bg-canvas); --wall2:var(--bg-surface); --sofa:var(--bg-surface-elevated); --sofa2:var(--bg-surface-hover);
}

/* ---- 3. BASE ---- */
html { font-size:15px; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; }
body { font-family:var(--font-sans); font-size:var(--text-base); line-height:1.5; color:var(--text-primary); background-color:var(--bg-canvas); overflow-wrap:anywhere; }
h1,h2,h3,h4 { color:var(--text-primary); letter-spacing:-0.01em; }
a { color:var(--gold-text); }
::placeholder { color:var(--text-muted); opacity:1; }
::selection { background:var(--gold-bg-subtle); }
:focus-visible { outline:2px solid var(--border-focus); outline-offset:2px; }
.tabular-nums, .num, td.num, th.num, .money, .money-cell { font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1; }
::-webkit-scrollbar { width:8px; height:8px; } ::-webkit-scrollbar-thumb { background:var(--border-strong); border-radius:99px; }

/* ---- 4. TOUCH TARGETS: at least 48 x 48 ---- */
button, .btn, [role="button"], [role="tab"], .tab, .tab-btn, .nav-item, .nav-link, .mini-btn, .theme-toggle, summary,
input[type="button"], input[type="submit"], a.btn, a.share-btn, .share-btn, .remove-btn, .generate-btn {
  min-height:var(--touch-target) !important; min-width:var(--touch-target) !important;   /* hard rule: a page's own smaller size must not win */
  font-family:inherit; font-size:max(14px, 1em);
}
select, textarea, input:not([type="checkbox"]):not([type="radio"]):not([type="hidden"]):not([type="range"]):not([type="color"]):not([type="file"]) {
  min-height:var(--touch-target) !important; font-family:inherit; font-size:max(15px, 1em);
  color:var(--text-primary); background-color:var(--bg-input); border:1px solid var(--border-subtle); border-radius:var(--radius-md);
}
textarea { min-height:96px !important; }
input[type="color"] { min-height:var(--touch-target) !important; min-width:var(--touch-target) !important; padding:4px; }
select:focus, textarea:focus, input:focus { outline:none; border-color:var(--border-focus); box-shadow:0 0 0 3px var(--gold-bg-subtle); }
input[type="checkbox"], input[type="radio"] { width:24px; height:24px; accent-color:var(--gold-primary); cursor:pointer; vertical-align:middle; }
label:has(> input[type="checkbox"]), label:has(> input[type="radio"]) { display:inline-flex; align-items:center; gap:var(--space-2); min-height:var(--touch-target); cursor:pointer; }
button, .btn, [role="button"], .tab, .mini-btn { cursor:pointer; border-radius:var(--radius-md); }
button:disabled, .btn:disabled { opacity:.55; cursor:not-allowed; }
label, th, .label, .lbl, small { font-size:max(12px, 1em); }

/* ---- 5. SHARED COMPONENT LOOK ---- */
table { border-collapse:collapse; }
th { color:var(--text-muted); font-weight:600; text-transform:uppercase; letter-spacing:.04em; border-bottom:1px solid var(--border-strong); }
td { border-bottom:1px solid var(--border-subtle); }
tbody tr:hover { background:var(--bg-surface-hover); }
.card, .panel { background:var(--bg-surface); border:1px solid var(--border-subtle); border-radius:var(--radius-lg); box-shadow:var(--shadow-sm); color:var(--text-primary); }
dialog, .modal, .modal-box { background:var(--bg-surface); color:var(--text-primary); border:1px solid var(--border-strong); border-radius:var(--radius-lg); box-shadow:var(--shadow-lg); }
.modal-bg, .modal-overlay { background:rgba(0,0,0,.65); }

/* design-system buttons, usable in any markup */
.btn { display:inline-flex; align-items:center; justify-content:center; gap:var(--space-2); padding:var(--space-3) var(--space-5); border:1px solid transparent; font-weight:600; text-decoration:none; transition:background-color .15s, border-color .15s, transform .15s; }
.btn:active { transform:scale(.98); }
.btn-primary, .btn-p { background:var(--gold-primary); color:var(--text-on-accent); box-shadow:var(--shadow-gold); }
.btn-primary:hover, .btn-p:hover { background:var(--gold-hover, #a07a12); }
.btn-secondary, .btn-s { background:var(--bg-surface-elevated); color:var(--text-primary); border-color:var(--border-subtle); }
.btn-secondary:hover, .btn-s:hover { background:var(--bg-surface-hover); border-color:var(--border-strong); }
.btn-outline-gold { background:var(--gold-bg-subtle); color:var(--gold-text); border-color:var(--gold-border-subtle); }
.btn-danger { background:var(--status-danger-bg); color:var(--status-danger); border-color:var(--status-danger); }
.badge { display:inline-flex; align-items:center; gap:4px; padding:2px 10px; border-radius:var(--radius-full); font-size:var(--text-xs); font-weight:600; background:var(--bg-surface-elevated); color:var(--text-secondary); }
.badge-ok { background:var(--status-success-bg); color:var(--status-success); } .badge-warn { background:var(--status-warning-bg); color:var(--status-warning); } .badge-bad { background:var(--status-danger-bg); color:var(--status-danger); }

/* inline SVG icons (replace every emoji) */
.bh-icon { width:1.25em; height:1.25em; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; vertical-align:-.22em; flex-shrink:0; }
.bh-icon.bh-fill { fill:currentColor; stroke:none; }

/* ---- 6. PHONE ---- */
@media (max-width:768px) { html { font-size:15px; } }
/* ---- 7. OWNER SHELL (public/bathco_complete.html) ---- */
#chip-slot { display:inline-flex; align-items:center; }
#chip-slot > button { position:static !important; top:auto !important; right:auto !important; z-index:auto !important; min-height:48px; }
.sidebar { background:var(--bg-glass-fallback); border-right:1px solid var(--border-subtle); }
.sidebar .nav-item { border:1px solid transparent; border-radius:var(--radius-md); color:var(--text-secondary); padding-top:0; padding-bottom:0; align-items:center; }
.sidebar .nav-item:hover { background:var(--bg-surface-hover); color:var(--text-primary); }
.sidebar .nav-item.active { background:var(--gold-bg-subtle); color:var(--gold-text); border-color:var(--gold-border-subtle); font-weight:600; }
.sidebar .nav-icon .bh-icon, .nav-icon svg { width:20px; height:20px; }
.nav-label { font-size:var(--text-sm); }
.nav-sep { font-size:var(--text-xs); color:var(--text-muted); }
.topbar, header.topbar { background:var(--bg-glass-fallback); border-bottom:1px solid var(--border-subtle); }
.theme-toggle { width:48px; height:48px; border-radius:var(--radius-full); color:var(--gold-text); }
.logout-btn { border:1px solid var(--border-subtle); border-radius:var(--radius-md); color:var(--text-primary); background:var(--bg-surface-elevated); padding:0 var(--space-4); }
.live-clock { font-family:var(--font-mono); font-variant-numeric:tabular-nums; }
#bottom-nav { background:var(--bg-glass-fallback); }
#bottom-nav button .bi .bh-icon { width:22px; height:22px; }
#bottom-nav button { font-size:var(--text-xs); }

/* ---- 6b. older palette names (emerald / earth / gold-NNN) used by a few screens ---- */
:root, [data-theme="dark"], [data-theme="gold"], [data-theme="light"], [data-theme="water"] {
  --emerald-900:var(--text-primary); --emerald-800:var(--gold-primary); --emerald-700:var(--gold-primary);
  --earth-800:var(--text-primary); --earth-700:var(--text-secondary); --earth-500:var(--text-muted);
  --gold-500:var(--gold-primary); --gold-400:var(--gold-hover, #a07a12); --gold-300:var(--gold-text);
}

/* ---- 6c. PRINT: paper stays white with dark ink, whatever theme is on screen ---- */
@media print {
  :root, [data-theme] {
    --bg-canvas:#fff; --bg-surface:#fff; --bg-surface-elevated:#f1f3f7; --bg-surface-hover:#eaedf3; --bg-input:#fff;
    --border-subtle:#cfd6df; --border-strong:#9aa5b4; --text-primary:#000; --text-secondary:#222; --text-muted:#444;
    --gold-primary:#6b4f08; --gold-text:#6b4f08; --text-on-accent:#fff; --shadow-sm:none; --shadow-md:none;
  }
  body { background:#fff !important; color:#000 !important; }
}

/* ---- 8. SCREEN-SPECIFIC ---- */
/* POS billing */
.share-btn.print { background:var(--bg-surface-elevated) !important; color:var(--text-primary) !important; border:1px solid var(--border-strong); }
.receipt { background:#fff; color:#111; border-radius:var(--radius-md); }       /* the bill is paper: stays white and dark in every theme */
.receipt { --text-primary:#111; --text-secondary:#333; --text-muted:#555; --border-subtle:#ddd; --border-strong:#999; --bg-surface:#fff; --gold-primary:#6b4f08; --gold-text:#6b4f08; }

.item-row { grid-template-columns:1fr 84px 110px 48px !important; }

/* ---- 9. PHONE FIT ---- */
input, select, textarea { box-sizing:border-box; max-width:100%; min-width:0; }
@media (max-width:480px) {
  .item-row { grid-template-columns:1fr 1fr 48px !important; }          /* POS: name on its own line, then qty, price, remove */
  .item-row .pick-wrap { grid-column:1 / -1; }
}

/* ---- 10. THEME PICKER (Settings) ---- */
.bh-theme-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:var(--space-3); }
.bh-theme-btn { display:flex; flex-direction:column; align-items:flex-start; gap:4px; padding:var(--space-3); text-align:left; background:var(--bg-surface-elevated); color:var(--text-primary); border:2px solid var(--border-subtle); border-radius:var(--radius-md); }
.bh-theme-btn small { color:var(--text-muted); font-weight:400; }
.bh-theme-btn.on { border-color:var(--gold-primary); background:var(--gold-bg-subtle); }
.bh-theme-btn .bh-sw { width:56px; height:32px; border:2px solid; border-radius:var(--radius-sm); display:flex; align-items:flex-end; padding:4px; }
.bh-theme-btn .bh-sw i { display:block; width:60%; height:6px; border-radius:3px; }

/* ---- 11. PAGE HEADERS: neutral in every theme (readable text, no gold band) ---- */
body > header:not(.topbar) { background:var(--bg-surface); color:var(--text-primary); border-bottom:1px solid var(--border-subtle); }
body > header:not(.topbar) h1 { color:var(--text-primary); }
body > header:not(.topbar) .sub, body > header:not(.topbar) .date, body > header:not(.topbar) p { color:var(--text-muted); }

/* ---- 6d. remaining older names some screens still use ---- */
:root, [data-theme="dark"], [data-theme="gold"], [data-theme="light"], [data-theme="water"] {
  --stone-50:var(--bg-surface-subtle); --stone-100:var(--bg-surface-elevated);
  --green-100:var(--status-success-bg); --green-700:var(--status-success);
  --red-100:var(--status-danger-bg); --red-600:var(--status-danger);
  --em8:var(--gold-primary); --em9:var(--gold-active); --gold-hover:var(--gold-hover, #a07a12);
}

/* ---- 12. CONTRAST FIXES FOUND IN THE AUDIT ---- */
:root, [data-theme="dark"], [data-theme="gold"], [data-theme="water"] { --text-on-danger:#000000; }
[data-theme="light"] { --text-on-danger:#ffffff; }
#sheet { background:var(--bg-surface-hover) !important; }

[data-theme="light"] { --purple:#6d28d9; }

/* ---- 13. PHONE TABLES: scroll inside the table, never squeeze columns into tall rows ---- */
@media (max-width:640px) {
  table { display:block; max-width:100%; overflow-x:auto; -webkit-overflow-scrolling:touch; }
  th, td { white-space:nowrap; }
  td.wrap, td .wrap, td.note, td.notes { white-space:normal; min-width:180px; }
}

/* ---- 14. PHONE TOP BAR (owner shell) ---- */
@media (max-width:640px) {
  header.topbar, .topbar { gap:8px; padding-left:12px !important; padding-right:12px !important; }
  .topbar > div:first-child { min-width:0; flex:1 1 auto; }
  #page-title { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #page-sub, .live-clock { display:none !important; }
  /* 24 Oct: the page title ran over the Search button; let the title block shrink and cut with ... */
  .topbar-brand > div { min-width:0; overflow:hidden; }
  .topbar-brand .brand-logo { flex-shrink:0; max-width:64px; object-fit:contain; }
  #chip-slot > * { font-size:11px !important; padding:5px 9px !important; min-height:36px !important; }
  .theme-toggle { min-width:40px !important; width:40px !important; padding:0 !important; }
  .logout-btn { padding:0 8px !important; font-size:12px !important; }
  #toasts { bottom:84px !important; left:10px; right:10px; }          /* messages sit above the bottom bar, not over it */
  #ld-float { bottom:132px !important; right:10px !important; transform:scale(.88); transform-origin:bottom right; }   /* Send to Layla no longer covers the cards */
  #page-title { min-width:0; font-size:15px !important; }
  .topbar-brand .brand-logo { max-width:38px; }
  #pal-btn { font-size:0 !important; min-width:44px; padding:0 !important; }
  #pal-btn:before { content:"\2315"; font-size:22px; line-height:1; }
  .topbar-right { flex-shrink:0; gap:6px !important; }
  #chip-slot > button { white-space:nowrap; padding:0 10px; font-size:12px; }
  .logout-btn { white-space:nowrap; padding:0 12px; font-size:13px; }
}

/* ---- 15. POS: the single column must be allowed to shrink below its content ---- */
@media (max-width:800px) { .wrap { grid-template-columns:minmax(0,1fr) !important; } .wrap > *, .panel { min-width:0; } .pick-list { min-width:0 !important; max-width:100% !important; } }

/* ---- 16. LABELS: one column on phones must be allowed to shrink ---- */
@media (max-width:899px) { .cols { grid-template-columns:minmax(0,1fr) !important; } .cols > * { min-width:0; } }


/* ---- 17. BRAND LOGO IN THE HEADER ---- */
.topbar-brand { display:flex; align-items:center; gap:12px; min-width:0; }
.brand-logo { height:44px; width:auto; object-fit:contain; flex-shrink:0; }
@media (max-width:640px) { .brand-logo { height:30px; width:auto; } .topbar > .topbar-brand { flex:1 1 auto; min-width:0; } }

/* SOFT tone (11 Nov 2026, AJ: not too dark): same Gold look, lighter slate surfaces. Only variables change, so every dark rule still applies. */
[data-theme="dark"][data-tone="soft"], [data-theme="gold"][data-tone="soft"] {
  --bg-canvas:#2f3642; --bg-surface:#3a4250; --bg-surface-elevated:#444d5d; --bg-surface-subtle:#353d4a; --bg-surface-hover:#4f596b; --bg-input:#2f3642;
  --bg-glass:rgba(58,66,80,.92); --bg-glass-fallback:#3a4250f5;
  --border-subtle:#566074; --border-strong:#6b7790;
  --text-primary:#f6f8fb; --text-secondary:#d6dce8; --text-muted:#a9b4c8; --text-on-accent:#1b1f26;
}

/* RBH Modern: 50 calm animations (transform/opacity only, one run each, 150-450 ms). 11 Nov 2026.
   Use: add class ra-NAME (and ra-d1..ra-d8 to stagger). No reduce-motion switch-off on purpose: the shop PC has Windows animations off. */
:root{--ra-ease:cubic-bezier(.16,1,.3,1);--ra-spring:cubic-bezier(.34,1.56,.64,1)}
@keyframes ra-fade-up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.ra-fade-up{animation:ra-fade-up .38s var(--ra-spring) both}
@keyframes ra-fade-down{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
.ra-fade-down{animation:ra-fade-down .38s var(--ra-spring) both}
@keyframes ra-fade-left{from{opacity:0;transform:translateX(-16px)}to{opacity:1;transform:none}}
.ra-fade-left{animation:ra-fade-left .38s var(--ra-spring) both}
@keyframes ra-fade-right{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
.ra-fade-right{animation:ra-fade-right .38s var(--ra-spring) both}
@keyframes ra-fade{from{opacity:0}to{opacity:1}}
.ra-fade{animation:ra-fade .38s var(--ra-spring) both}
@keyframes ra-zoom-in{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
.ra-zoom-in{animation:ra-zoom-in .38s var(--ra-spring) both}

/* ===== modern dashboard panel (#dash-modern) ===== */
#dash-modern{margin-bottom:16px;font-size:14px}
#dash-modern .dm-head{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap;margin-bottom:12px}
#dash-modern .dm-title{font-size:clamp(20px,3vw,28px);font-weight:800;letter-spacing:-.01em;text-wrap:balance}
#dash-modern .dm-sub{font-size:12px;color:var(--text2)}
#dash-modern .dm-grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));margin-bottom:12px}
#dash-modern .dm-grid.two{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
#dash-modern .dm-card{background:var(--card);border:1px solid var(--card-border);border-radius:16px;padding:14px 16px;min-width:0;position:relative;overflow:hidden}
#dash-modern .dm-lab{font-size:12px;color:var(--text2);font-weight:600}
#dash-modern .dm-val{font-size:clamp(20px,3.2vw,26px);font-weight:800;margin-top:6px;letter-spacing:-.01em;line-height:1.1;word-break:break-word}
#dash-modern .dm-gold{color:var(--gold)}
#dash-modern .dm-chip{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;margin-top:8px}
#dash-modern .dm-chip.up{background:rgba(52,211,153,.16);color:#34d399}#dash-modern .dm-chip.down{background:rgba(248,113,113,.16);color:#f87171}#dash-modern .dm-chip.flat{background:rgba(148,163,184,.18);color:var(--text2)}
#dash-modern h3{font-size:15px;font-weight:800;margin:0 0 2px}
#dash-modern .dm-note{font-size:12px;color:var(--text2);margin:0 0 10px}
#dash-modern svg{display:block;width:100%;height:auto;overflow:visible}
#dash-modern .dm-spark{position:absolute;right:10px;bottom:8px;width:84px;height:34px;opacity:.9}
#dash-modern .rc-bar{transform-origin:50% 100%;animation:ra-bar-rise .7s var(--ra-spring) both;animation-delay:calc(var(--i,0)*35ms)}
#dash-modern .rc-hbar{transform-origin:0 50%;animation:ra-bar-slide .7s var(--ra-spring) both;animation-delay:calc(var(--i,0)*60ms)}
#dash-modern .rc-line{stroke-dasharray:1;stroke-dashoffset:1;animation:rcDraw 1.1s var(--ra-ease) forwards}
@keyframes rcDraw{to{stroke-dashoffset:0}}
#dash-modern .rc-ring{transition:stroke-dashoffset 1.1s var(--ra-ease)}
#dash-modern .rc-seg{animation:ra-fade .6s ease both;animation-delay:calc(var(--i,0)*90ms)}
#dash-modern .rc-heat{animation:ra-dot-in .45s var(--ra-spring) both;animation-delay:calc(var(--i,0)*18ms);transform-box:fill-box;transform-origin:center}
#dash-modern .rc-tube{transform-origin:50% 100%;animation:ra-tube-rise .9s var(--ra-spring) both;animation-delay:calc(var(--i,0)*70ms)}
#dash-modern .dm-legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--text2);margin-top:8px}
#dash-modern .dm-legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
#dash-modern .dm-empty{padding:18px;text-align:center;color:var(--text2);font-size:13px}
#dash-modern .dm-row{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:5px 0}
#dash-modern button.dm-btn{min-height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--card-border);background:var(--card);color:inherit;font-size:13px;cursor:pointer}
