<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Bath Hub — Home</title>
  <style>
    :root {
      --bg-main: #121212;
      --bg-card: #1e1e1e;
      --bg-card-active: #2a2a2a;
      --border-color: #333333;
      --gold-primary: #d4af37;
      --gold-light: #f3e5ab;
      --text-main: #f5f5f5;
      --text-muted: #a0a0a0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: 20px 16px;
      padding-bottom: calc(20px + env(safe-area-inset-bottom));
    }

    header {
      text-align: center;
      margin-bottom: 24px;
      padding-top: env(safe-area-inset-top);
    }

    .shop-title {
      color: var(--gold-primary);
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .shop-subtitle {
      color: var(--text-muted);
      font-size: 14px;
      margin-top: 4px;
    }

    .button-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      flex: 1;
      align-content: center;
    }

    .action-btn {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-left: 5px solid var(--gold-primary);
      border-radius: 14px;
      padding: 20px;
      display: flex;
      align-items: center;
      gap: 18px;
      text-decoration: none;
      color: var(--text-main);
      transition: background-color 0.15s ease, transform 0.1s ease;
      min-height: 84px;
      cursor: pointer;
    }

    .action-btn:active {
      background-color: var(--bg-card-active);
      transform: scale(0.98);
    }

    .btn-icon {
      font-size: 32px;
      line-height: 1;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(212, 175, 55, 0.1);
      border-radius: 10px;
      color: var(--gold-primary);
      flex-shrink: 0;
    }

    .btn-text {
      display: flex;
      flex-direction: column;
    }

    .btn-title {
      font-size: 20px;
      font-weight: 600;
      color: var(--text-main);
    }

    .btn-subtitle {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 2px;
    }
  </style>
</head>
<body>

  <header>
    <div class="shop-title">Bath Hub</div>
    <div class="shop-subtitle">Shop Overview</div>
  </header>

  <main class="button-grid">
    <a href="/bathco_complete.html#/pos" class="action-btn" onclick="openPage('pos', event)">
      <div class="btn-icon">🛒</div>
      <div class="btn-text">
        <span class="btn-title">Sell</span>
        <span class="btn-subtitle">New sale and checkout</span>
      </div>
    </a>

    <a href="/bathco_complete.html#/grn" class="action-btn" onclick="openPage('grn', event)">
      <div class="btn-icon">📥</div>
      <div class="btn-text">
        <span class="btn-title">Receive stock</span>
        <span class="btn-subtitle">Add new items from supplier</span>
      </div>
    </a>

    <a href="/bathco_complete.html#/stock" class="action-btn" onclick="openPage('stock', event)">
      <div class="btn-icon">📦</div>
      <div class="btn-text">
        <span class="btn-title">Items</span>
        <span class="btn-subtitle">View stock list and prices</span>
      </div>
    </a>

    <a href="/bathco_complete.html#/dashboard" class="action-btn" onclick="openPage('dashboard', event)">
      <div class="btn-icon">📊</div>
      <div class="btn-text">
        <span class="btn-title">Today</span>
        <span class="btn-subtitle">Today's sales total</span>
      </div>
    </a>
  </main>

  <script>
    function openPage(pageKey, event) {
      if (window.parent && window.parent !== window && window.parent.location.pathname.includes('bathco_complete.html')) {
        event.preventDefault();
        window.parent.location.hash = '#/' + pageKey;
      } else {
        window.location.href = '/bathco_complete.html#/' + pageKey;
      }
    }
  </script>

</body>
</html>
