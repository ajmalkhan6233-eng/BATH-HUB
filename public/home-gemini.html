function vs(a,b,l){const p=pct(a,b);return p===null?'':(p>=0?'+':'')+p+'% '+l}
async function load(){
 try{const r=await fetch('/api/dashboard-pro',{credentials:'same-origin'});if(!r.ok)throw 0;const d=await r.json();draw(d)}
 catch(e){$('main').style.display='none';$('err').style.display='block'}
}
function draw(d){
 const s=d.sales,t=d.targets,h=new Date().getHours();
 $('hi').textContent=(h<12?'Good morning':h<18?'Good afternoon':'Good evening')+', AJ';
 $('stamp').textContent='updated '+new Date(d.generated_at).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
 if(!window._cu){window._cu=1;countUp($('t'),+s.today||0,R);countUp($('w'),+s.week||0,R);countUp($('b'),+s.bills_today||0,x=>Math.round(x));countUp($('a'),+s.avg_bill_today||0,R)}else{$('t').textContent=R(s.today);$('w').textContent=R(s.week);$('b').textContent=s.bills_today;$('a').textContent=R(s.avg_bill_today)}$('tv').innerHTML=vs(s.today,s.same_day_last_week,'vs same day last week')?'<span class=chip>'+vs(s.today,s.same_day_last_week,'vs same day last week')+'</span>':'';
 $('wv').textContent=vs(s.week,s.last_week_same_point,'vs last week');
 $('bv').textContent=s.bills_week+' this week';
 
 const days=d.daily||[],mx=Math.max(1,...days.map(x=>+x.total||0)),W=600,H=150;
 const pts=days.map((x,i)=>[days.length>1?i*W/(days.length-1):0,H-(+x.total||0)/mx*H+10]);
 const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
 $('ch').innerHTML='<defs><linearGradient id="gg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d4af37" stop-opacity=".35"/><stop offset="1" stop-color="#d4af37" stop-opacity="0"/></linearGradient></defs><path d="'+line+' L'+W+',170 L0,170 Z" fill="url(#gg)"/><path d="'+line+'" fill="none" stroke="#dcc166" stroke-width="3" stroke-linecap="round" id="ln"/>';var ln=$('ln');if(ln&&ln.getTotalLength){var L=ln.getTotalLength();ln.style.setProperty('--len',L);ln.style.strokeDasharray=L;ln.style.animation='drawl 1.4s ease-out both'}
 const tot=days.reduce((a,x)=>a+(+x.total||0),0);$('chn').textContent='14-day total '+R(tot);
 const mp=t.month>0?Math.min(100,Math.round(s.month/t.month*100)):0;
 $('mp').textContent=mp+'% of '+R(t.month);$('mb').style.width=mp+'%';$('mm').textContent=R(s.month);
 const left=Math.max(0,t.days_in_month-t.day_of_month+1);$('md').textContent=R(left?Math.max(0,t.month-s.month)/left:0);
 $('mpace').textContent=R(t.day_of_month?s.month/t.day_of_month*t.days_in_month:0);
 const pays=d.payments_today||[];$('pay').innerHTML=pays.length?pays.map(p=>'<div class="row"><span>'+(p.method||p.payment_method||'Other')+'</span><span>'+R(p.amount)+'</span></div>').join(''):'<small class="n">No sales yet today.</small>';
 const st=d.stock||{},low=st.low_list||[];$('lown').textContent=(st.low_stock||0)+' low, '+(st.out_of_stock||0)+' out of stock';
 $('low').innerHTML=low.length?low.slice(0,8).map(i=>'<div class="row"><span>'+(i.name||i.item_code)+'<br><small class="n">'+(i.item_code||'')+' · reorder at '+(i.reorder_threshold??'')+'</small></span><span class="'+((+i.stock_level)<=0?'bad':'warn')+'">'+(i.stock_level??'')+'</span></div>').join(''):'<small class="n ok">Nothing low. All good.</small>';
 const v=d.vendors||{};$('vn').textContent='Total '+R(v.owed)+' across '+(v.bills||0)+' bills'+((d.cheques&&d.cheques.pending)?' · '+R(d.cheques.pending)+' covered by cheques not cleared yet':'');
 $('vend').innerHTML=(v.list||[]).slice(0,6).map(x=>'<div class="row"><span>'+x.vendor_name+'</span><span>'+R(x.owed)+'</span></div>').join('')||'<small class="n">Nothing owed.</small>';
}

function countUp(el,to,fmt){const t0=performance.now(),d=900;(function f(n){const k=Math.min(1,(n-t0)/d),e=1-Math.pow(1-k,3);el.textContent=fmt(to*e);if(k<1)requestAnimationFrame(f)})(t0)}
document.querySelectorAll('.glass-card').forEach((c,i)=>c.style.animationDelay=(i*70)+'ms');
try{if(localStorage.rbhTheme==='l')document.body.classList.add('lt')}catch(e){}
load();setInterval(load,120000);
</script></body></html>
