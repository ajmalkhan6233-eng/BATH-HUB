<!DOCTYPE html>
<html lang="en"><head><link rel="stylesheet" href="/rbh-font.css"><script src="/rbh-early.js"></script><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vendor return or discount</title>
<style>
:root{--bg:#0D0D0D;--card:rgba(255,255,255,.05);--bd:rgba(255,255,255,.12);--tx:#f0f0f0;--tx2:#9a9a9a;--gold:#F5A623;--green:#22c55e;--red:#ef4444}
@media (prefers-color-scheme:light){:root{--bg:#f4f5f7;--card:#fff;--bd:rgba(0,0,0,.12);--tx:#1a1a1a;--tx2:#555}}
*{box-sizing:border-box}body{margin:0;padding:14px;background:var(--bg);color:var(--tx);font:16px -apple-system,Segoe UI,Roboto,sans-serif}
h1{font-size:20px;color:var(--gold);margin:0 0 4px}.sub{color:var(--tx2);margin-bottom:12px;font-size:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
label{display:block;font-size:13px;color:var(--tx2);margin:8px 0 3px}
select,input{width:100%;padding:11px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit;min-height:44px}
button{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:11px 14px;font:inherit;cursor:pointer;min-height:44px}
button.big{width:100%;background:var(--gold);color:#000;font-weight:700;border:0;margin-top:12px}
.vtabs{display:flex;gap:8px}.vtabs button{flex:1}.vtabs button.on{border-color:var(--gold);color:var(--gold)}
.row{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:6px;margin-bottom:6px}.msg{margin-top:10px;font-size:15px}.ok{color:var(--green)}.err{color:var(--red)}
.hint{color:var(--tx2);font-size:13px}.list div{padding:7px 0;border-bottom:1px solid var(--bd);font-size:14px}

.hit{border:1px solid var(--bd);border-radius:10px;padding:9px;margin-top:8px;font-size:14px}.hit b{color:var(--gold)}
.opt{display:flex;gap:8px;align-items:flex-start;padding:8px;border:1px solid var(--bd);border-radius:8px;margin-top:6px;cursor:pointer;font-size:14px}.opt input{width:20px;min-height:20px;margin-top:2px}.opt.on{border-color:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.chips button{min-height:36px;padding:6px 10px;font-size:13px}
html body{max-width:760px;margin-left:auto!important;margin-right:auto!important}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
</style><link rel="stylesheet" href="/compact-all.css"></head><body>
<h1>Vendor return</h1>
<div class="sub">Pay less to the vendor. Stock and cost change with it, together. Owner or admin only.</div>
<div class="card">
  <div id="billBox" hidden><label for="bill">Vendor bill</label><select id="bill"></select></div>
  <div class="vtabs" style="margin-top:10px"><button id="tr" class="on" type="button">Return goods</button><button id="td" type="button">Discount</button></div>
  <div id="retBox"><label for="code">Item code</label><input id="code" inputmode="numeric" autocomplete="off" placeholder="Type the code and press Enter">
  <div id="found"><div class="hint" style="margin-top:8px">Vendor, bill and cost show here after you type the code.</div></div></div>
  <div id="disBox" hidden><label for="amt">Discount amount (Rs.)</label><input id="amt" type="number" inputmode="decimal" min="0" step="0.01"></div>
  <label for="why">Reason (needed)</label><input id="why" maxlength="120"><div class="chips"><button type="button">Damaged</button><button type="button">Wrong item</button><button type="button">Not ordered</button><button type="button">Quality problem</button></div>
  <button class="big" id="go" type="button">Confirm</button>
  <div class="msg" id="msg"></div>
</div>
<div class="card"><b>Saved today in this session</b><div class="list" id="done"><div class="hint">Nothing yet.</div></div></div>
<script>
var kind='RETURN',cur=null,sel=0;
function $(i){return document.getElementById(i)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function money(n){return Number(n).toLocaleString('en-LK',{maximumFractionDigits:2})}
function say(t,bad){var m=$('msg');m.textContent=t;m.className='msg '+(bad?'err':'ok')}
function pick(k){kind=k;$('tr').className=k==='RETURN'?'on':'';$('td').className=k==='DISCOUNT'?'on':'';$('retBox').hidden=k!=='RETURN';$('disBox').hidden=k!=='DISCOUNT';$('billBox').hidden=k!=='DISCOUNT';$('go').textContent=k==='RETURN'?'Deduct':'Confirm'}
$('tr').onclick=function(){pick('RETURN')};$('td').onclick=function(){pick('DISCOUNT')};pick('RETURN');
/* BLOCK: code lookup (type the code, vendor and cost come by themselves) */
function look(){
  var c=$('code').value.trim();cur=null;$('found').innerHTML='';say('');
  if(!c){$('found').innerHTML='<div class="hint" style="margin-top:8px">Vendor, bill and cost show here after you type the code.</div>';return}
  fetch('/api/vendor-returns/lookup?code='+encodeURIComponent(c),{credentials:'include'}).then(function(r){return r.json().then(function(j){return{ok:r.ok,j:j}})}).then(function(x){
    if(!x.ok){say(x.j.error||'Not found',1);return}
    cur=x.j;sel=0;draw();$('qty').focus();
  }).catch(function(){say('No connection.',1)});
}
function draw(){
  var it=cur.item,h='<div class="hit"><b>'+esc(it.item_code)+'</b> '+esc(it.name)+'<br>In stock now: <b>'+money(it.stock_level)+'</b></div>';
  if(!cur.bills.length){h+='<div class="hint" style="margin-top:8px">No open vendor bill carries this item. Use Discount, or check the GRN.</div>';$('found').innerHTML=h;return}
  h+='<label>Which vendor bill</label>';
  cur.bills.forEach(function(b,i){h+='<label class="opt'+(i===sel?' on':'')+'"><input type="radio" name="bl" value="'+i+'"'+(i===sel?' checked':'')+'><span><b>'+esc(b.vendor_name)+'</b> · bill '+esc(b.bill_no||'-')+' · '+esc(b.bill_date)+'<br>Bought '+money(b.bought)+' at Rs. '+money(b.unit_cost)+' each · bill still owes Rs. '+money(b.room)+'</span></label>'});
  h+='<div class="two"><div><label for="qty">Pieces going back</label><input id="qty" type="number" inputmode="decimal" min="0" step="any"></div><div><label for="rate">Credit per piece (Rs.)</label><input id="rate" type="number" inputmode="decimal" min="0" step="0.01" value="'+esc(cur.bills[sel].unit_cost)+'"></div></div><div class="hint" id="tot"></div>';
  $('found').innerHTML=h;
  Array.prototype.forEach.call(document.getElementsByName('bl'),function(r){r.onchange=function(){sel=Number(r.value);draw();$('qty').focus()}});
  $('qty').oninput=$('rate').oninput=tot;
}
function tot(){var q=Number($('qty').value)||0,r=Number($('rate').value)||0;$('tot').textContent=q>0?'Vendor credit: Rs. '+money(q*r)+'  ·  stock after: '+money(cur.item.stock_level-q):''}
$('code').addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();look()}});
$('code').addEventListener('change',look);
Array.prototype.forEach.call(document.querySelectorAll('.chips button'),function(b){b.onclick=function(){$('why').value=b.textContent;$('why').focus()}});
fetch('/api/vendor-ledger/bills',{credentials:'include'}).then(function(r){return r.json()}).then(function(b){
  var open=b.filter(function(x){return !x.voided&&x.outstanding>0});
  $('bill').innerHTML=open.length?open.map(function(x){return '<option value="'+x.id+'">'+esc(x.vendor_name)+' - '+esc(x.bill_no)+' - owed Rs. '+money(x.outstanding)+'</option>'}).join(''):'<option value="">No open bills</option>'
}).catch(function(){$('bill').innerHTML='<option value="">Could not load bills</option>'});
$('go').onclick=function(){
  var body={kind:kind,reason:$('why').value.trim()},ask;
  if(kind==='RETURN'){
    if(!cur||!cur.bills.length){say('Type an item code first.',1);return}
    var b=cur.bills[sel],q=Number($('qty').value),r=Number($('rate').value);
    if(!(q>0)){say('Put how many pieces go back.',1);return}
    if(q>Number(cur.item.stock_level)){say('Only '+money(cur.item.stock_level)+' in stock.',1);return}
    if(q>Number(b.bought)){say('That bill only had '+money(b.bought)+' of this item.',1);return}
    body.bill_id=b.bill_id;body.lines=[{item_code:cur.item.item_code,qty:q,rate:r}];
    ask='Send '+money(q)+' x '+cur.item.item_code+' back to '+b.vendor_name+'? Stock goes down and the bill drops by Rs. '+money(q*r)+'.';
  } else { body.bill_id=Number($('bill').value);body.amount=Number($('amt').value);if(!body.bill_id){say('Pick a bill first.',1);return}ask='Take Rs. '+money(body.amount||0)+' off this bill?' }
  if(!body.reason){say('Write a short reason.',1);$('why').focus();return}
  if(!confirm(ask))return;
  $('go').disabled=true;
  fetch('/api/vendor-returns',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
   .then(function(r){return r.json().then(function(j){return{ok:r.ok,j:j}})}).then(function(x){
     $('go').disabled=false;
     if(!x.ok){say(x.j.error||'Not saved. Nothing changed.',1);return}
     say('Saved. Credited Rs. '+money(x.j.credited)+'. Still owed: Rs. '+money(x.j.owed_after)+'.',0);
     var d=$('done');if(d.firstChild&&d.firstChild.className==='hint')d.innerHTML='';
     var e=document.createElement('div');e.textContent=x.j.credit_note.note_no+' - Rs. '+money(x.j.credited);d.insertBefore(e,d.firstChild);
     if(kind==='RETURN'){$('code').value='';$('why').value='';cur=null;$('found').innerHTML='';$('code').focus()}
   }).catch(function(){$('go').disabled=false;say('No connection. Nothing was saved.',1)});
};
</script></body></html>
