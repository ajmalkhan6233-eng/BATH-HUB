<!DOCTYPE html>
<html lang="en">
<head>
<script src="/bathhub-theme.js"></script><script src="/bathhub-icons.js"></script><script src="/bathhub-a11y.js" defer></script>
<script>if (window.top === window.self) location.replace('/owner#/brain');   // one app: opened on its own -> open it inside /owner</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RBH Brain — Royal Bath Hub</title>
<style>
  :root{--bg:var(--bg-page,#f6f7f5);--card:var(--card,#fff);--tx:var(--text,#1c2a24);--mut:#6b7a73;--ac:#0a6b4a;--bd:#dfe5e1}
  @media (prefers-color-scheme:dark){:root{--bg:var(--bg-page,#10181a);--card:var(--card,#1a2427);--tx:var(--text,#e8f0ec);--mut:#9db0a8;--bd:#2a3a3e}}
  *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,sans-serif}
  .wrap{max-width:760px;margin:0 auto;padding:12px 16px 90px}
  h1{font-size:20px;margin:6px 0 10px}
  input,textarea{width:100%;font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px}
  textarea{min-height:46vh;resize:vertical;line-height:1.55}
  button{font:inherit;border:0;border-radius:12px;padding:11px 16px;background:var(--ac);color:#fff;font-weight:600;cursor:pointer}
  button.ghost{background:transparent;color:var(--ac);border:1px solid var(--ac)}
  button.small{padding:7px 12px;font-size:14px}
  .row{display:flex;gap:8px;align-items:center;margin:8px 0;flex-wrap:wrap}.grow{flex:1;min-width:0}
  .chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px}.chip{white-space:nowrap;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:999px;padding:5px 12px;font-size:14px;font-weight:500}
  .chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
  .note{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin:8px 0;cursor:pointer}
  .note b{display:block}.note small{color:var(--mut)}
  .view h2,.view h3,.view h4{margin:14px 0 6px}.view p{margin:8px 0}.view ul{padding-left:22px}
  a.wl{color:var(--ac);font-weight:600;text-decoration:none;border-bottom:1px dashed var(--ac)}a.wl.new{color:#b45309;border-color:#b45309}
  .tag{color:var(--ac);font-weight:600}
  .fab{position:fixed;right:18px;bottom:18px;width:56px;height:56px;border-radius:50%;font-size:28px;padding:0;box-shadow:0 4px 14px #0004}
  .mut{color:var(--mut);font-size:14px}.err{color:#b91c1c}
  .ph{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.ph div{position:relative}.ph img{width:96px;height:96px;object-fit:cover;border-radius:10px;border:1px solid var(--bd);display:block}.ph button{position:absolute;top:2px;right:2px;padding:0;width:26px;height:26px;border-radius:50%;background:#000a;font-size:14px}
  .big{position:fixed;inset:0;background:#000d;display:flex;align-items:center;justify-content:center;z-index:9}.big img{max-width:96vw;max-height:92vh;border-radius:8px}
  .rec{display:flex;gap:8px;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:9px 12px;margin:6px 0}.rec .k{font-size:12px;font-weight:700;color:var(--ac);text-transform:uppercase;min-width:52px}.rec small{display:block;color:var(--mut)}.rec button{padding:2px 9px;background:transparent;color:var(--mut);font-size:18px}
  .pick{margin:8px 0;padding:10px;border:1px dashed var(--bd);border-radius:12px}.pick select{width:100%;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);margin-bottom:8px}
  #map{background:var(--card);border:1px solid var(--bd);border-radius:14px;width:100%;height:68vh;touch-action:manipulation}#map text{fill:var(--tx);font-size:10px;pointer-events:none}#map line{stroke:var(--mut);stroke-opacity:.55}#map circle{fill:var(--ac);cursor:pointer}#map circle.pin{fill:#c9a227}
  .back{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
</style>
</head>
<body>
<div class="wrap">
  <h1>RBH Brain 🧠</h1>
  <div id="list">
    <input id="q" type="search" placeholder="Search your notes" autocomplete="off">
    <div class="chips" id="tags"></div>
    <div id="notes"></div>
    <p class="mut" id="empty" hidden>No notes yet. Tap + to write the first one.</p>
    <div class="row"><button class="ghost small" id="showmap">🗺 Map of notes</button><a class="mut" href="/api/brain/export">Download all notes (Markdown)</a></div>
    <button class="fab" id="add" aria-label="New note">+</button>
  </div>
  <div id="mapv" hidden><div class="row"><button class="ghost small" id="mapback">← Notes</button><span class="mut" id="mapinfo"></span></div><svg id="map" viewBox="0 0 360 520" role="img" aria-label="Map of your notes"></svg></div>
  <div id="note" hidden>
    <div class="row"><button class="ghost small" id="back">← Notes</button><span class="grow"></span><button class="ghost small" id="pin">Pin</button><button class="ghost small" id="edit">Edit</button></div>
    <div id="editor" hidden>
      <input id="title" placeholder="Title" maxlength="200">
      <textarea id="body" placeholder="Write here. Link notes with [[Title]]. Add tags like #vendor"></textarea>
      <div class="row"><button class="ghost small" id="mic" hidden>🎤 Speak</button><span class="mut" id="mictip">Tip: use the 🎤 on your keyboard to speak.</span></div>
      <div class="row"><button id="save">Save</button><button class="ghost" id="cancel">Cancel</button><span class="grow"></span><button class="ghost small" id="del">Delete</button></div>
    </div>
    <div id="viewer"><h2 id="vt"></h2><div class="view" id="vb"></div><div id="recs"></div><div class="row"><button class="ghost small" id="addrec">🔗 Link a shop record</button></div><div class="pick" id="pick" hidden><select id="kind"><option value="item">Item</option><option value="vendor">Vendor</option><option value="bill">Vendor bill</option><option value="cheque">Cheque</option></select><input id="rq" type="search" placeholder="Type a name or number" autocomplete="off"><div id="rres"></div></div><div class="ph" id="ph"></div><div class="row"><button class="ghost small" id="addph">📷 Add photo</button><input type="file" id="file" accept="image/*" hidden></div><p class="mut" id="vm"></p><div id="bl" hidden><p class="mut">Linked from</p><div class="back" id="bls"></div></div></div>
    <p class="err" id="msg"></p>
  </div>
</div>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var cur = null, curTag = '', timer = null, isNew = false;
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function api(path, opt) {
    opt = opt || {}; var o = { method: opt.method || 'GET', credentials: 'same-origin', headers: {} };
    if (opt.body) { o.headers['Content-Type'] = 'application/json'; o.body = JSON.stringify(opt.body); }
    return fetch('/api/brain' + path, o).then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok) throw new Error(j.error || 'Something went wrong'); return j; }); });
  }
  // Safe markdown: everything is escaped first, then only a few patterns become tags.
  function inline(s, links) {
    s = esc(s);
    s = s.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/(^|[\s(])\*([^*]+)\*/g, '$1<i>$2</i>');
    s = s.replace(/\[\[([^\[\]]{1,200})\]\]/g, function (_m, t) {
      var parts = t.split('|'), key = parts[0].trim().toLowerCase(), label = (parts[1] || parts[0]).trim();
      var hit = links[key];
      return '<a href="#" class="wl' + (hit ? '' : ' new') + '" data-t="' + esc(parts[0].trim()) + '">' + label + '</a>';
    });
    return s.replace(/(^|\s)#([\p{L}\p{N}_-]{1,40})/gu, '$1<span class="tag">#$2</span>');
  }
  function render(md, links) {
    var out = [], ul = false;
    String(md || '').split('\n').forEach(function (ln) {
      var m;
      if ((m = /^(#{1,3})\s+(.*)$/.exec(ln))) { if (ul) { out.push('</ul>'); ul = false; } out.push('<h' + (m[1].length + 1) + '>' + inline(m[2], links) + '</h' + (m[1].length + 1) + '>'); }
      else if ((m = /^\s*[-*]\s+(.*)$/.exec(ln))) { if (!ul) { out.push('<ul>'); ul = true; } out.push('<li>' + inline(m[1], links) + '</li>'); }
      else { if (ul) { out.push('</ul>'); ul = false; } if (ln.trim()) out.push('<p>' + inline(ln, links) + '</p>'); }
    });
    if (ul) out.push('</ul>');
    return out.join('');
  }
  function show(which) { $('list').hidden = which !== 'list'; $('note').hidden = which !== 'note'; $('mapv').hidden = which !== 'map'; }
  function loadList() {
    var qs = '?q=' + encodeURIComponent($('q').value) + (curTag ? '&tag=' + encodeURIComponent(curTag) : '');
    api('/notes' + qs).then(function (d) {
      $('empty').hidden = d.notes.length > 0 || !!$('q').value || !!curTag;
      $('notes').innerHTML = d.notes.map(function (n) { return '<div class="note" data-id="' + n.id + '"><b>' + (n.pinned ? '📌 ' : '') + esc(n.title) + '</b><small>' + esc(n.snippet) + '</small></div>'; }).join('');
    }).catch(function (e) { $('notes').innerHTML = '<p class="err">' + esc(e.message) + '</p>'; });
    api('/tags').then(function (d) {
      $('tags').innerHTML = d.tags.map(function (t) { return '<button class="chip' + (t.tag === curTag ? ' on' : '') + '" data-tag="' + esc(t.tag) + '">#' + esc(t.tag) + ' ' + t.n + '</button>'; }).join('');
    }).catch(function () {});
  }
  function openNote(id) {
    $('msg').textContent = '';
    api('/notes/' + id).then(function (d) {
      cur = d; isNew = false; var links = {}; d.links.forEach(function (l) { if (l.id) links[l.key] = l; });
      $('vt').textContent = d.note.title; $('vb').innerHTML = render(d.note.body, links) || '<p class="mut">Empty. Tap Edit.</p>';
      $('vm').textContent = 'Updated ' + new Date(d.note.updated_at).toLocaleString();
      $('bl').hidden = !d.backlinks.length;
      $('bls').innerHTML = d.backlinks.map(function (b) { return '<button class="chip" data-id="' + b.id + '">' + esc(b.title) + '</button>'; }).join('');
      $('recs').innerHTML = (d.records || []).map(function (r) { return '<div class="rec"><span class="k">' + esc(r.kind) + '</span><span class="grow"><b>' + esc(r.label) + '</b><small>' + esc(r.facts) + '</small></span><button data-delrec="' + r.ref_id + '" aria-label="Unlink">×</button></div>'; }).join(''); $('pick').hidden = true;
      $('ph').innerHTML = (d.photos || []).map(function (id) { return '<div><img src="/api/brain/photos/' + id + '" alt="note photo" data-big="' + id + '"><button data-delph="' + id + '" aria-label="Remove photo">×</button></div>'; }).join('');
      $('pin').textContent = d.note.pinned ? 'Unpin' : 'Pin';
      $('editor').hidden = true; $('viewer').hidden = false; $('edit').hidden = false; $('pin').hidden = false; show('note');
    }).catch(function (e) { alert(e.message); });
  }
  function startEdit(n) {
    isNew = !n; $('title').value = n ? n.note.title : ''; $('body').value = n ? n.note.body : '';
    $('editor').hidden = false; $('viewer').hidden = true; $('edit').hidden = true; $('pin').hidden = true; $('del').hidden = isNew; show('note'); $('msg').textContent = '';
    (isNew ? $('title') : $('body')).focus();
  }
  $('add').onclick = function () { cur = null; startEdit(null); };
  $('back').onclick = function () { show('list'); loadList(); };
  $('edit').onclick = function () { startEdit(cur); };
  $('cancel').onclick = function () { if (isNew || !cur) { show('list'); } else { openNote(cur.note.id); } };
  $('save').onclick = function () {
    var body = { title: $('title').value, body: $('body').value };
    var p = isNew ? api('/notes', { method: 'POST', body: body }) : api('/notes/' + cur.note.id, { method: 'PUT', body: body });
    p.then(function (r) { openNote(isNew ? r.id : cur.note.id); }).catch(function (e) { $('msg').textContent = e.message; });
  };
  $('del').onclick = function () { if (!cur || !confirm('Delete this note? It stays in your backup.')) return; api('/notes/' + cur.note.id, { method: 'DELETE' }).then(function () { show('list'); loadList(); }).catch(function (e) { $('msg').textContent = e.message; }); };
  $('pin').onclick = function () { api('/notes/' + cur.note.id, { method: 'PUT', body: { pinned: !cur.note.pinned } }).then(function () { openNote(cur.note.id); }).catch(function (e) { $('msg').textContent = e.message; }); };
  $('q').oninput = function () { clearTimeout(timer); timer = setTimeout(loadList, 250); };
  $('tags').onclick = function (e) { var t = e.target.closest('[data-tag]'); if (!t) return; curTag = curTag === t.dataset.tag ? '' : t.dataset.tag; loadList(); };
  $('notes').onclick = function (e) { var n = e.target.closest('[data-id]'); if (n) openNote(n.dataset.id); };
  $('bls').onclick = function (e) { var n = e.target.closest('[data-id]'); if (n) openNote(n.dataset.id); };
  $('vb').onclick = function (e) {
    var a = e.target.closest('a.wl'); if (!a) return; e.preventDefault();
    api('/open', { method: 'POST', body: { title: a.dataset.t } }).then(function (r) { if (r.created) { openNote(r.id); setTimeout(function () { startEdit(cur); }, 400); } else openNote(r.id); }).catch(function (er) { $('msg').textContent = er.message; });
  };
  // photos: shrink to a JPEG (max 1280 px) on the phone, then upload
  $('addph').onclick = function () { $('file').click(); };
  $('file').onchange = function () {
    var f = this.files[0]; this.value = ''; if (!f || !cur) return;
    var img = new Image(), url = URL.createObjectURL(f);
    img.onload = function () {
      var k = Math.min(1, 1280 / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      var q = 0.8, data = c.toDataURL('image/jpeg', q); while (data.length > 800000 && q > 0.3) { q -= 0.15; data = c.toDataURL('image/jpeg', q); }
      api('/notes/' + cur.note.id + '/photos', { method: 'POST', body: { data: data } }).then(function () { openNote(cur.note.id); }).catch(function (e) { $('msg').textContent = e.message; });
    };
    img.onerror = function () { $('msg').textContent = 'Could not read that photo'; };
    img.src = url;
  };
  $('ph').onclick = function (e) {
    var d = e.target.closest('[data-delph]'), b = e.target.closest('[data-big]');
    if (d) { if (confirm('Remove this photo?')) api('/photos/' + d.dataset.delph, { method: 'DELETE' }).then(function () { openNote(cur.note.id); }).catch(function (er) { $('msg').textContent = er.message; }); return; }
    if (b) { var o = document.createElement('div'); o.className = 'big'; o.innerHTML = '<img src="/api/brain/photos/' + b.dataset.big + '" alt="note photo">'; o.onclick = function () { o.remove(); }; document.body.appendChild(o); }
  };
  // voice: browser speech where it exists (iPhone Safari does); otherwise the keyboard mic works anyway
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition, rec = null;
  if (SR) {
    $('mic').hidden = false; $('mictip').hidden = true;
    $('mic').onclick = function () {
      if (rec) { rec.stop(); return; }
      rec = new SR(); rec.lang = 'en-US'; rec.interimResults = false; rec.continuous = true;
      rec.onresult = function (ev) { var t = ''; for (var i = ev.resultIndex; i < ev.results.length; i++) if (ev.results[i].isFinal) t += ev.results[i][0].transcript + ' '; if (t) { var b = $('body'); b.value += (b.value && !/\s$/.test(b.value) ? ' ' : '') + t.trim(); } };
      rec.onend = function () { rec = null; $('mic').textContent = '🎤 Speak'; };
      rec.onerror = function () { rec = null; $('mic').textContent = '🎤 Speak'; };
      $('mic').textContent = '⏹ Stop'; try { rec.start(); } catch (e) { rec = null; $('mic').textContent = '🎤 Speak'; }
    };
  }
  loadList();
  // link a shop record (read-only look-up on the server)
  var rtimer = null;
  function searchRec() {
    var t = $('rq').value.trim(); if (t.length < 2) { $('rres').innerHTML = '<p class="mut">Type 2 letters or more</p>'; return; }
    api('/lookup?kind=' + $('kind').value + '&q=' + encodeURIComponent(t)).then(function (d) {
      $('rres').innerHTML = d.results.length ? d.results.map(function (r) { return '<div class="rec" data-k="' + esc(r.kind) + '" data-key="' + esc(r.key) + '" style="cursor:pointer"><span class="grow"><b>' + esc(r.label) + '</b><small>' + esc(r.facts) + '</small></span></div>'; }).join('') : '<p class="mut">Nothing found</p>';
    }).catch(function (e) { $('rres').innerHTML = '<p class="err">' + esc(e.message) + '</p>'; });
  }
  $('addrec').onclick = function () { $('pick').hidden = !$('pick').hidden; $('rres').innerHTML = ''; $('rq').value = ''; if (!$('pick').hidden) $('rq').focus(); };
  $('rq').oninput = function () { clearTimeout(rtimer); rtimer = setTimeout(searchRec, 300); };
  $('kind').onchange = searchRec;
  $('rres').onclick = function (e) { var r = e.target.closest('[data-key]'); if (!r) return; api('/notes/' + cur.note.id + '/refs', { method: 'POST', body: { kind: r.dataset.k, key: r.dataset.key } }).then(function () { openNote(cur.note.id); }).catch(function (er) { $('msg').textContent = er.message; }); };
  $('recs').onclick = function (e) { var d = e.target.closest('[data-delrec]'); if (d) api('/refs/' + d.dataset.delrec, { method: 'DELETE' }).then(function () { openNote(cur.note.id); }).catch(function (er) { $('msg').textContent = er.message; }); };
  // map of notes: a small force layout, drawn as SVG; tap a dot to open the note
  function layout(nodes, edges) {
    var W = 360, H = 520, i, j, n = nodes.length, idx = {};
    nodes.forEach(function (d, k) { idx[d.id] = k; var a = 6.2832 * k / Math.max(1, n); d.x = W / 2 + Math.cos(a) * 110; d.y = H / 2 + Math.sin(a) * 150; d.vx = 0; d.vy = 0; });
    for (var it = 0; it < 260; it++) {
      for (i = 0; i < n; i++) for (j = i + 1; j < n; j++) {
        var dx = nodes[i].x - nodes[j].x, dy = nodes[i].y - nodes[j].y, d2 = dx * dx + dy * dy + 0.01, f = 900 / d2, d = Math.sqrt(d2);
        nodes[i].vx += dx / d * f; nodes[i].vy += dy / d * f; nodes[j].vx -= dx / d * f; nodes[j].vy -= dy / d * f;
      }
      edges.forEach(function (e) { var a = nodes[idx[e.from]], b = nodes[idx[e.to]]; if (!a || !b) return; var dx = b.x - a.x, dy = b.y - a.y, d = Math.sqrt(dx * dx + dy * dy) + 0.01, f = (d - 55) * 0.02; a.vx += dx / d * f; a.vy += dy / d * f; b.vx -= dx / d * f; b.vy -= dy / d * f; });
      nodes.forEach(function (d) { d.vx += (W / 2 - d.x) * 0.004; d.vy += (H / 2 - d.y) * 0.004; d.x = Math.max(24, Math.min(W - 24, d.x + d.vx * 0.6)); d.y = Math.max(20, Math.min(H - 20, d.y + d.vy * 0.6)); d.vx *= 0.6; d.vy *= 0.6; });
    }
  }
  function drawMap() {
    api('/graph').then(function (g) {
      if (!g.nodes.length) { $('map').innerHTML = '<text x="180" y="260" text-anchor="middle">No notes yet</text>'; $('mapinfo').textContent = ''; return; }
      layout(g.nodes, g.edges); var pos = {}; g.nodes.forEach(function (d) { pos[d.id] = d; });
      var h = g.edges.map(function (e) { return '<line x1="' + pos[e.from].x.toFixed(1) + '" y1="' + pos[e.from].y.toFixed(1) + '" x2="' + pos[e.to].x.toFixed(1) + '" y2="' + pos[e.to].y.toFixed(1) + '"/>'; }).join('');
      h += g.nodes.map(function (d) { var t = d.title.length > 16 ? d.title.slice(0, 15) + '…' : d.title; return '<circle class="' + (d.pinned ? 'pin' : '') + '" cx="' + d.x.toFixed(1) + '" cy="' + d.y.toFixed(1) + '" r="9" data-id="' + d.id + '"><title>' + esc(d.title) + '</title></circle><text x="' + d.x.toFixed(1) + '" y="' + (d.y + 21).toFixed(1) + '" text-anchor="middle">' + esc(t) + '</text>'; }).join('');
      $('map').innerHTML = h; $('mapinfo').textContent = g.nodes.length + ' notes · ' + g.edges.length + ' links';
    }).catch(function (e) { $('mapinfo').textContent = e.message; });
  }
  $('showmap').onclick = function () { show('map'); drawMap(); };
  $('mapback').onclick = function () { show('list'); loadList(); };
  $('map').onclick = function (e) { var c = e.target.closest('circle[data-id]'); if (c) openNote(c.dataset.id); };
})();
</script>
</body>
</html>
