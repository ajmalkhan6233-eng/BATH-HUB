<!DOCTYPE html>
<html lang="en"><head>
<script src="/bathhub-theme.js"></script><script src="/bathhub-icons.js"></script><script src="/bathhub-a11y.js" defer></script>
<script src="/offline-queue.js"></script><script>if (window.OfflineQueue) OfflineQueue.install();</script>
<script>if (window.top === window.self) location.replace('/owner#/customers');</script>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Customers</title>
<style>
:root{--gold:#F5A623;--bg:#0D0D0D;--bg2:#141414;--card:rgba(255,255,255,.04);--card-border:rgba(255,255,255,.1);--text:#f0f0f0;--text2:#999;--green:#22c55e;--red:#ef4444}
@media (prefers-color-scheme:light){:root{--bg:#f4f5f7;--bg2:#fff;--card:#fff;--card-border:rgba(0,0,0,.12);--text:#1a1a1a;--text2:#555}}
*{box-sizing:border-box}body{margin:0;padding:14px;background:var(--bg);color:var(--text);font:14px/1.4 system-ui,Segoe UI,sans-serif}
h1{font-size:20px;margin:0 0 4px;color:var(--gold)}.sub{color:var(--text2);margin-bottom:12px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
button{background:var(--card);color:var(--text);border:1px solid var(--card-border);border-radius:8px;padding:7px 11px;cursor:pointer;font:inherit}
button.gold{background:var(--gold);color:var(--text-on-accent);border-color:var(--gold);font-weight:600}
.card{background:var(--card);border:1px solid var(--card-border);border-radius:12px;padding:12px;margin-bottom:10px}
.wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:560px}th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--card-border);font-size:14px}th{color:var(--text2);font-weight:600}
tr.r{cursor:pointer}tr.r:hover{background:var(--card)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:14px}
.modal.show{display:flex}.box{background:var(--bg2);border:1px solid var(--card-border);border-radius:12px;padding:16px;width:100%;max-width:440px;max-height:85vh;overflow:auto}
label{display:block;margin:8px 0 3px;color:var(--text2);font-size:12px}input,textarea{width:100%;padding:8px;border-radius:8px;border:1px solid var(--card-border);background:var(--bg);color:var(--text);font:inherit}
.acts{display:flex;gap:6px;margin-top:12px}#msg{min-height:20px;margin-bottom:8px}.err{color:var(--red)}.ok{color:var(--green)}.meta{color:var(--text2);font-size:12px}
</style><link rel="stylesheet" href="/bathhub-design.css">
</head><body>
<h1>Customers</h1><div class="sub">Everyone who has contacted or bought from the shop. Tap a row to edit.</div>
<div class="bar"><input id="q" placeholder="Search name, phone, location" style="max-width:280px"><button class="gold" id="add">+ Add customer</button><button id="reload">Refresh</button><span class="meta" id="cnt"></span></div>
<div id="msg"></div>
<div class="card wrap"><table><thead><tr><th>Name</th><th>Phone</th><th>WhatsApp</th><th>Location</th><th>Source</th><th>Last contact</th></tr></thead><tbody id="tb"></tbody></table></div>
<div class="modal" id="m"><div class="box" id="mb"></div></div>
<script>
const E=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id);let ROWS=[];
async function api(path,method,body){
  const r=await fetch(path,{method:method||'GET',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined,credentials:'same-origin'});
  let j={};try{j=await r.json()}catch(e){}
  if(!r.ok)throw new Error(j.error||('Error '+r.status));return j;}
function msg(t,ok){$('msg').innerHTML='<span class="'+(ok?'ok':'err')+'">'+E(t)+'</span>';}
const dt=d=>d?new Date(d).toLocaleDateString('en-GB'):'—';
async function load(){try{ROWS=await api('/api/customers');render();}catch(e){msg(e.message)}}
function render(){
  const q=$('q').value.trim().toLowerCase();
  const rows=ROWS.filter(c=>!q||[c.name,c.phone,c.whatsapp,c.location].some(v=>String(v||'').toLowerCase().includes(q)));
  $('cnt').textContent=rows.length+' shown';
  $('tb').innerHTML=rows.map(c=>'<tr class="r" data-id="'+E(c.id)+'"><td>'+E(c.name||'—')+'</td><td>'+E(c.phone||'—')+'</td><td>'+E(c.whatsapp||'—')+'</td><td>'+E(c.location||'—')+'</td><td>'+E(c.source||'—')+'</td><td>'+E(dt(c.last_contact))+'</td></tr>').join('')||'<tr><td colspan="6" class="meta">No customers.</td></tr>';}
function close(){$('m').classList.remove('show');}
function form(c){
  c=c||{};
  $('mb').innerHTML='<h3 style="margin-top:0">'+(c.id?'Edit customer':'Add customer')+'</h3><label>Name</label><input id="f_n" value="'+E(c.name)+'"><label>Phone (required)</label><input id="f_p" value="'+E(c.phone)+'"><label>WhatsApp</label><input id="f_w" value="'+E(c.whatsapp)+'"><label>Location</label><input id="f_l" value="'+E(c.location)+'"><label>Notes</label><textarea id="f_t" rows="2">'+E(c.notes)+'</textarea><div id="fe" class="err"></div><div class="acts"><button class="gold" id="f_go">Save</button><button id="f_x">Cancel</button></div>';
  $('m').classList.add('show');$('f_x').onclick=close;
  $('f_go').onclick=async()=>{
    const b={name:$('f_n').value,phone:$('f_p').value.trim(),whatsapp:$('f_w').value,location:$('f_l').value,notes:$('f_t').value};
    if(!b.phone){$('fe').textContent='Phone is required';return;}
    try{await api(c.id?'/api/customers/'+encodeURIComponent(c.id):'/api/customers',c.id?'PUT':'POST',b);close();msg('Saved',1);load();}catch(e){$('fe').textContent=e.message}};
}
$('add').onclick=()=>form();$('reload').onclick=load;$('q').oninput=render;
$('m').addEventListener('click',e=>{if(e.target.id==='m')close();});
$('tb').addEventListener('click',e=>{const tr=e.target.closest('tr[data-id]');if(!tr)return;form(ROWS.find(x=>String(x.id)===tr.dataset.id));});
load();
</script></body></html>
